<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1628">
<title>MIG Society · Emergency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   RESET & TOKENS
═══════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;cursor:pointer;border:none;outline:none}

:root{
  --midnight-900:#0b1628;
  --midnight-800:#112040;
  --midnight-700:#172c58;
  --midnight-600:#1e3a72;
  --midnight-500:#274d96;
  --midnight-400:#3b66b8;
  --midnight-300:#6b94d4;
  --midnight-200:#a8c4ec;
  --midnight-100:#d8e8f8;
  --midnight-50: #eef5fc;

  --jade-700:#065f46;
  --jade-600:#047857;
  --jade-500:#059669;
  --jade-400:#10b981;
  --jade-100:#d1fae5;
  --jade-50: #ecfdf5;

  --coral-600:#dc2626;
  --coral-500:#ef4444;
  --coral-100:#fee2e2;
  --coral-50: #fef2f2;

  --amber-600:#d97706;
  --amber-500:#f59e0b;
  --amber-100:#fef3c7;
  --amber-50: #fffbeb;

  --teal-600:#0d9488;
  --teal-500:#14b8a6;
  --teal-100:#ccfbf1;
  --teal-50: #f0fdfa;

  --rose-600:#e11d48;
  --rose-500:#f43f5e;
  --rose-100:#ffe4e6;
  --rose-50: #fff1f2;

  --bg:      #f2f6fb;
  --surface: #ffffff;
  --surface-2:#f8fafd;
  --surface-3:#eef3f9;

  --ink:     #0b1628;
  --ink-2:   #344f6e;
  --ink-3:   #6a86a4;
  --ink-4:   #a0b4c8;

  --line:    rgba(23,44,88,0.08);
  --line-md: rgba(23,44,88,0.13);
  --line-lg: rgba(23,44,88,0.20);

  --s-xs: 0 1px 3px rgba(7,15,35,0.05);
  --s-sm: 0 2px 8px rgba(7,15,35,0.07),0 1px 2px rgba(7,15,35,0.04);
  --s-md: 0 6px 20px rgba(7,15,35,0.09),0 2px 6px rgba(7,15,35,0.04);
  --s-lg: 0 18px 48px rgba(7,15,35,0.12),0 4px 12px rgba(7,15,35,0.05);
  --s-blue:0 8px 28px rgba(30,58,114,0.28);
  --s-jade:0 8px 24px rgba(6,120,87,0.22);

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --r-xl: 24px;

  --ease-out:    cubic-bezier(0.16,1,0.3,1);
  --ease-spring: cubic-bezier(0.34,1.56,0.64,1);

  --topbar-h:  56px;
  --nav-h:     50px;
  --mobnav-h:  70px;
  --safe-bot:  env(safe-area-inset-bottom,0px);
  --safe-top:  env(safe-area-inset-top,0px);
}

/* ═══════════════════════════════════════
   KEYFRAMES
═══════════════════════════════════════ */
@keyframes fadeDown {from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes fadeUp   {from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none}}
@keyframes fadeIn   {from{opacity:0}                            to{opacity:1}}
@keyframes scaleIn  {from{opacity:0;transform:scale(0.93) translateY(-4px)} to{opacity:1;transform:none}}
@keyframes shimmer  {from{transform:translateX(-100%)} to{transform:translateX(200%)}}
@keyframes cardIn   {from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none}}

/* ═══════════════════════════════════════
   DESKTOP TOP-BAR
═══════════════════════════════════════ */
.topbar{
  position:sticky;top:0;z-index:200;
  height:var(--topbar-h);
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(24px) saturate(200%);
  -webkit-backdrop-filter:blur(24px) saturate(200%);
  border-bottom:1px solid var(--line);
  box-shadow:var(--s-xs);
  display:flex;align-items:center;
  padding:0 28px;gap:16px;
  animation:fadeDown 0.4s var(--ease-out) both;
}
.topbar-brand{flex:1;min-width:0;display:flex;align-items:center;gap:11px}
.brand-gem{
  width:36px;height:36px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(140deg,var(--midnight-700),var(--midnight-500));
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--s-blue);position:relative;overflow:hidden;
}
.brand-gem::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.18),transparent 60%)}
.brand-gem svg{color:#fff;position:relative;z-index:1}
.brand-copy{min-width:0}
.brand-name{font-size:0.9rem;font-weight:700;color:var(--ink);letter-spacing:-0.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-tag {font-size:0.68rem;color:var(--ink-3);font-weight:400;margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:9px}
.profile-wrap{position:relative}
.profile-btn{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(140deg,var(--midnight-700),var(--midnight-400));
  color:#fff;font-size:0.82rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--s-blue);
  transition:transform 0.18s var(--ease-spring);
}
.profile-btn:hover{transform:scale(1.09)}
.profile-dropdown{
  position:absolute;right:0;top:calc(100% + 10px);
  background:var(--surface);border:1px solid var(--line-md);
  border-radius:var(--r-md);box-shadow:var(--s-lg);
  min-width:145px;overflow:hidden;display:none;z-index:300;
  transform-origin:top right;
  animation:scaleIn 0.22s var(--ease-spring) both;
}
.profile-dropdown.open{display:block}
.profile-dropdown button{
  width:100%;background:transparent;
  padding:11px 16px;text-align:left;
  color:var(--ink);font-size:0.84rem;font-weight:500;
  display:flex;align-items:center;gap:9px;
  transition:background 0.12s;
}
.profile-dropdown button:hover{background:var(--surface-2);color:var(--coral-600)}

/* ═══════════════════════════════════════
   DESKTOP NAV
═══════════════════════════════════════ */
.desknav{
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:stretch;padding:0 20px;
  animation:fadeIn 0.35s 0.05s var(--ease-out) both;
}
.dn-item{
  display:flex;align-items:center;gap:7px;
  padding:0 16px;height:var(--nav-h);
  font-size:0.83rem;font-weight:500;color:var(--ink-3);
  border-bottom:2.5px solid transparent;
  text-decoration:none;white-space:nowrap;
  transition:color 0.16s,border-color 0.16s;letter-spacing:0.01em;
}
.dn-item:hover{color:var(--midnight-600)}
.dn-item.active{color:var(--midnight-600);font-weight:600;border-bottom-color:var(--midnight-500)}
.dn-item svg{opacity:0.6;transition:opacity 0.16s}
.dn-item:hover svg,.dn-item.active svg{opacity:1}
.nav-pill{
  min-width:20px;height:20px;border-radius:999px;
  padding:0 6px;font-size:0.65rem;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--midnight-100);color:var(--midnight-600);
  transition:background 0.16s,color 0.16s;
}
.dn-item.active .nav-pill{background:var(--midnight-500);color:#fff}

/* ═══════════════════════════════════════
   MOBILE HEADER
═══════════════════════════════════════ */
.mob-header{
  display:none;
  position:sticky;top:0;z-index:200;
  height:calc(58px + var(--safe-top));
  padding-top:var(--safe-top);
  background:rgba(11,22,40,0.97);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,0.06);
  align-items:center;justify-content:space-between;
  padding-left:18px;padding-right:18px;
  box-shadow:0 4px 24px rgba(0,0,0,0.3);
}
.mob-brand{display:flex;align-items:center;gap:9px}
.mob-gem{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(140deg,var(--midnight-500),var(--midnight-400));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(39,77,150,0.4);
}
.mob-gem svg{color:#fff}
.mob-name{font-size:0.92rem;font-weight:700;color:#fff;letter-spacing:-0.01em}
.mob-right{display:flex;align-items:center;gap:8px}
.mob-profile{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(140deg,var(--midnight-500),var(--midnight-400));
  color:#fff;font-size:0.76rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(39,77,150,0.4);
}
.mob-header .profile-wrap{position:relative}
.mob-header .profile-dropdown button{background:var(--surface);color:var(--ink)}
.mob-header .profile-dropdown button:hover{background:var(--surface-2)}

/* mobile search toggle */
.mob-search-btn{
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.16);
  color:#fff;display:flex;align-items:center;justify-content:center;
}
.mob-search-bar{
  display:none;
  background:var(--midnight-900);
  padding:10px 18px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.mob-search-bar.visible{display:block}
.mob-search-bar input{
  width:100%;height:38px;
  border:1px solid rgba(255,255,255,0.16);border-radius:var(--r-md);
  background:rgba(255,255,255,0.08);color:#fff;
  font-size:0.86rem;padding:0 14px;font-family:inherit;
}
.mob-search-bar input::placeholder{color:rgba(255,255,255,0.4)}
.mob-search-bar input:focus{border-color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.12)}

/* ═══════════════════════════════════════
   MOBILE BOTTOM NAV (4 tabs)
═══════════════════════════════════════ */
.mob-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;
  padding-bottom:var(--safe-bot);
  background:rgba(255,255,255,0.96);
  backdrop-filter:blur(28px) saturate(200%);-webkit-backdrop-filter:blur(28px) saturate(200%);
  border-top:1px solid var(--line);box-shadow:0 -6px 30px rgba(7,15,35,0.10);
}
.mob-nav-inner{display:grid;grid-template-columns:repeat(4,1fr);height:var(--mobnav-h)}
.mni{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;text-decoration:none;color:var(--ink-3);font-size:0.6rem;font-weight:600;
  letter-spacing:0.01em;position:relative;transition:color 0.16s;
  -webkit-tap-highlight-color:transparent;
}
.mni.active{color:var(--midnight-600)}
.mni-iw{position:relative;width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.mni-bg{position:absolute;inset:0;border-radius:10px;background:var(--midnight-50);transform:scale(0);transition:transform 0.22s var(--ease-spring)}
.mni.active .mni-bg{transform:scale(1)}
.mni svg{position:relative;z-index:1;transition:transform 0.22s var(--ease-spring)}
.mni.active svg{transform:scale(1.1)}
.mni::before{
  content:'';position:absolute;top:0;left:50%;
  transform:translateX(-50%) scaleX(0);
  width:24px;height:3px;border-radius:0 0 4px 4px;
  background:linear-gradient(90deg,var(--midnight-500),var(--midnight-300));
  transition:transform 0.22s var(--ease-spring);
}
.mni.active::before{transform:translateX(-50%) scaleX(1)}
.mni-lbl{position:relative;z-index:1}

/* ═══════════════════════════════════════
   PAGE BODY
═══════════════════════════════════════ */
.page{padding:22px 26px;max-width:1400px;margin:0 auto}

/* ═══════════════════════════════════════
   FILTER / SEARCH BAR
═══════════════════════════════════════ */
.filter-bar{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:13px 18px;
  display:flex;align-items:center;gap:10px;
  box-shadow:var(--s-sm);margin-bottom:20px;
  animation:fadeUp 0.4s 0.1s var(--ease-out) both;
}
.filter-icon{
  width:36px;height:36px;border-radius:var(--r-sm);
  background:var(--midnight-50);border:1px solid var(--midnight-100);
  display:flex;align-items:center;justify-content:center;
  color:var(--midnight-500);flex-shrink:0;
}
.filter-input{
  flex:1;height:36px;
  border:1px solid var(--line-md);border-radius:var(--r-sm);
  background:var(--surface-2);color:var(--ink);
  font-size:0.8rem;font-weight:400;padding:0 12px;
  transition:border-color 0.15s,box-shadow 0.15s;font-family:inherit;
}
.filter-input:focus{border-color:var(--midnight-400);box-shadow:0 0 0 3px rgba(39,77,150,0.10)}
.filter-input::placeholder{color:var(--ink-4)}
.filter-meta{font-size:0.72rem;font-weight:600;color:var(--ink-3);white-space:nowrap}

/* ═══════════════════════════════════════
   CATEGORY PILL TABS
═══════════════════════════════════════ */
.cat-tabs{
  display:flex;gap:8px;flex-wrap:wrap;
  margin-bottom:20px;
  animation:fadeUp 0.4s 0.12s var(--ease-out) both;
}
.cat-tab{
  height:34px;padding:0 14px;
  border:1px solid var(--line-md);border-radius:999px;
  background:var(--surface);color:var(--ink-3);
  font-size:0.78rem;font-weight:600;font-family:inherit;
  display:flex;align-items:center;gap:6px;
  transition:all 0.18s var(--ease-out);letter-spacing:0.01em;
}
.cat-tab:hover{background:var(--midnight-50);border-color:var(--midnight-200);color:var(--midnight-600)}
.cat-tab.active{background:var(--midnight-500);border-color:var(--midnight-500);color:#fff;box-shadow:0 4px 14px rgba(39,77,150,0.25)}
.cat-cnt{
  font-size:0.64rem;font-weight:700;padding:2px 6px;border-radius:999px;
  background:rgba(255,255,255,0.22);color:inherit;
}
.cat-tab:not(.active) .cat-cnt{background:var(--midnight-100);color:var(--midnight-600)}

/* ═══════════════════════════════════════
   MOBILE CATEGORY TABS (scrollable strip)
═══════════════════════════════════════ */
.mob-cat-strip{
  display:none;
  overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  gap:8px;padding:12px 18px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.mob-cat-strip::-webkit-scrollbar{display:none}
.mob-cat-strip.visible{display:flex}
.mob-cat-btn{
  flex-shrink:0;height:32px;padding:0 13px;
  border:1px solid var(--line-md);border-radius:999px;
  background:var(--surface-2);color:var(--ink-3);
  font-size:0.74rem;font-weight:600;font-family:inherit;
  scroll-snap-align:start;
  transition:all 0.16s;white-space:nowrap;
}
.mob-cat-btn.active{background:var(--midnight-500);border-color:var(--midnight-500);color:#fff}

/* ═══════════════════════════════════════
   SECTION CARDS (desktop)
═══════════════════════════════════════ */
.sections-wrap{display:grid;gap:20px}

.section-card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--s-sm);overflow:hidden;
  animation:cardIn 0.45s var(--ease-out) both;
  transition:box-shadow 0.22s;
}
.section-card:hover{box-shadow:var(--s-md)}
.section-head{
  padding:13px 20px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--surface),var(--surface-2));
  display:flex;align-items:center;gap:12px;
}
.section-icon{
  width:36px;height:36px;border-radius:var(--r-sm);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:1.05rem;position:relative;overflow:hidden;
}
.section-icon::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent 60%)}
.si-red  {background:linear-gradient(140deg,var(--coral-100),var(--coral-50))}
.si-blue {background:linear-gradient(140deg,var(--midnight-100),var(--midnight-50))}
.si-amber{background:linear-gradient(140deg,var(--amber-100),var(--amber-50))}
.si-jade {background:linear-gradient(140deg,var(--jade-100),var(--jade-50))}
.si-teal {background:linear-gradient(140deg,var(--teal-100),var(--teal-50))}
.section-head-text{flex:1;min-width:0}
.section-title-txt{font-size:0.9rem;font-weight:700;color:var(--ink);letter-spacing:-0.01em}
.section-badge{
  font-size:0.66rem;font-weight:700;
  padding:3px 9px;border-radius:999px;
  background:var(--midnight-100);color:var(--midnight-600);
}

/* contact table */
.ctable{width:100%;border-collapse:collapse}
.ctable th{
  background:var(--surface-2);color:var(--ink-3);
  padding:10px 20px;text-align:left;
  font-size:0.67rem;font-weight:700;text-transform:uppercase;letter-spacing:0.09em;
  border-bottom:1px solid var(--line);
}
.ctable td{
  padding:12px 20px;border-bottom:1px solid var(--surface-3);
  font-size:0.84rem;color:var(--ink-2);vertical-align:middle;
}
.ctable tr:last-child td{border-bottom:none}
.ctable tr:hover td{background:var(--midnight-50)}
.ctable td:first-child{font-weight:600;color:var(--ink)}
.num-link{
  color:var(--midnight-600);font-weight:600;
  font-family:'JetBrains Mono',monospace;font-size:0.82rem;
}
.num-link:hover{color:var(--midnight-500)}
.call-chip{
  display:inline-flex;align-items:center;gap:6px;
  height:30px;padding:0 13px;border-radius:999px;
  background:var(--jade-50);color:var(--jade-700);
  font-size:0.73rem;font-weight:700;
  border:1px solid var(--jade-100);text-decoration:none;
  transition:all 0.16s var(--ease-out);font-family:inherit;
}
.call-chip:hover{background:var(--jade-100);transform:translateY(-1px);box-shadow:var(--s-jade)}
.call-chip.disabled{background:var(--surface-3);color:var(--ink-4);border-color:var(--line);pointer-events:none}

/* ═══════════════════════════════════════
   MOBILE CONTACT CARDS
═══════════════════════════════════════ */
.mob-list{display:none;padding:0}
.mob-sec-label{
  font-size:0.65rem;font-weight:700;
  color:var(--ink-3);text-transform:uppercase;letter-spacing:0.1em;
  padding:16px 0 8px;display:flex;align-items:center;gap:8px;
}
.mob-sec-label::after{content:'';flex:1;height:1px;background:var(--line)}
.mob-contact-card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:14px 16px;
  margin-bottom:10px;
  display:flex;align-items:center;gap:13px;
  box-shadow:var(--s-xs);
  transition:transform 0.18s var(--ease-out),box-shadow 0.18s,border-color 0.14s;
  animation:cardIn 0.38s var(--ease-out) both;
}
.mob-contact-card:hover{transform:translateY(-1px);box-shadow:var(--s-sm);border-color:var(--line-md)}
.mob-contact-card:active{transform:none}
.mob-avatar{
  width:44px;height:44px;border-radius:var(--r-md);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;position:relative;overflow:hidden;
}
.mob-avatar::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent 60%)}
.mav-red  {background:linear-gradient(140deg,var(--coral-100),var(--coral-50))}
.mav-blue {background:linear-gradient(140deg,var(--midnight-100),var(--midnight-50))}
.mav-amber{background:linear-gradient(140deg,var(--amber-100),var(--amber-50))}
.mav-jade {background:linear-gradient(140deg,var(--jade-100),var(--jade-50))}
.mav-teal {background:linear-gradient(140deg,var(--teal-100),var(--teal-50))}
.mob-info{flex:1;min-width:0}
.mob-work{font-size:0.87rem;font-weight:700;color:var(--ink);letter-spacing:-0.01em;line-height:1.25}
.mob-name{font-size:0.73rem;color:var(--ink-3);margin-top:2px;font-weight:400}
.mob-num {font-size:0.75rem;font-weight:600;color:var(--midnight-500);font-family:'JetBrains Mono',monospace;margin-top:3px}
.mob-call-btn{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(140deg,var(--jade-600),var(--jade-500));
  color:#fff;display:flex;align-items:center;justify-content:center;
  text-decoration:none;box-shadow:var(--s-jade);
  transition:transform 0.18s var(--ease-spring),box-shadow 0.18s;
}
.mob-call-btn:hover{transform:scale(1.1);box-shadow:0 10px 24px rgba(6,120,87,0.30)}
.mob-call-btn:active{transform:scale(0.96)}
.mob-call-btn.disabled{background:var(--surface-3);color:var(--ink-4);box-shadow:none;pointer-events:none}

/* ═══════════════════════════════════════
   EMPTY / ERROR STATES
═══════════════════════════════════════ */
.empty-state{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:36px 24px;
  text-align:center;box-shadow:var(--s-sm);
  animation:fadeUp 0.4s var(--ease-out) both;
}
.empty-icon{
  width:52px;height:52px;border-radius:var(--r-lg);
  background:var(--midnight-50);border:1px solid var(--midnight-100);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;color:var(--midnight-300);
}
.empty-icon.err{background:var(--rose-50);border-color:var(--rose-100);color:var(--rose-600)}
.empty-title{font-size:0.92rem;font-weight:700;color:var(--ink);margin-bottom:5px}
.empty-title.err{color:var(--coral-600)}
.empty-sub{font-size:0.8rem;color:var(--ink-3);line-height:1.6;max-width:360px;margin:0 auto}
.retry-btn{
  margin-top:16px;height:36px;padding:0 18px;
  border-radius:var(--r-sm);background:var(--midnight-500);color:#fff;
  font-size:0.8rem;font-weight:600;border:none;cursor:pointer;font-family:inherit;
  transition:background 0.14s;display:inline-flex;align-items:center;gap:7px;
}
.retry-btn:hover{background:var(--midnight-600)}

/* ═══════════════════════════════════════
   SKELETON
═══════════════════════════════════════ */
.sk{position:relative;overflow:hidden;background:var(--surface-3)!important;border-radius:var(--r-sm);color:transparent!important;pointer-events:none}
.sk *{visibility:hidden!important}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,0.68) 50%,transparent);animation:shimmer 1.6s ease-in-out infinite}

/* ═══════════════════════════════════════
   RESPONSIVE — MOBILE (≤700px)

  .topbar,.desknav,.filter-bar,.cat-tabs,.sections-wrap{display:none}

  .mob-nav{display:block}
  .mob-list{display:block}
  body{background:#eef3fa}
  .page{padding:12px 14px;padding-bottom:calc(var(--mobnav-h) + var(--safe-bot) + 16px)}
}
@media(max-width:400px){.mob-avatar{width:38px;height:38px}}

<script>
/* ── Auth ── */
const AUTH_SESSION_KEY = "society_dashboard_auth";
if (sessionStorage.getItem(AUTH_SESSION_KEY) !== "true") sessionStorage.setItem(AUTH_SESSION_KEY, "true");

/* ── Constants (unchanged from original) ── */
const CONTACT_SHEET_ID = "15iii2nw4THbf-t-TdYNfj5WW2Aw4selhvfwu64YzisE";
const CONTACT_TAB_NAME = "emergency-contacts";
const SECTION_ORDER = ["SECURITY GUARD","HOUSING BOARD & NRDA","EMERGENCY HELPLINE","HOSPITALS","DAILY HELPS"];

/* Section display metadata */
const SECTION_META = {
  "SECURITY GUARD":       {cls:"si-red",  mcls:"mav-red",  emoji:"🛡️", label:"Security Guards"},
  "HOUSING BOARD & NRDA": {cls:"si-blue", mcls:"mav-blue", emoji:"🏛️", label:"Housing Board & NRDA"},
  "EMERGENCY HELPLINE":   {cls:"si-amber",mcls:"mav-amber",emoji:"🚨", label:"Emergency Helpline"},
  "HOSPITALS":            {cls:"si-jade", mcls:"mav-jade", emoji:"🏥", label:"Hospitals"},
  "DAILY HELPS":          {cls:"si-teal", mcls:"mav-teal", emoji:"🤝", label:"Daily Helps"},
};

/* ── State ── */
let contactSections = [];
let activeSectionIndex = 0;
let searchQuery = "";

/* ── Helpers (original, unchanged) ── */
function escapeHtml(v) {
  return String(v||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function parseCSVLine(line) {
  const cols = []; let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i], n = line[i+1];
    if (c==='"' && inQ && n==='"') { cur+='"'; i++; }
    else if (c==='"') inQ=!inQ;
    else if (c===',' && !inQ) { cols.push(cur); cur=""; }
    else cur+=c;
  }
  cols.push(cur);
  return cols.map(s => s.trim());
}
function normalizePhone(v) { return String(v||"").replace(/[^\d+]/g,""); }
function titleCase(v) {
  const n = String(v||"").trim().toUpperCase();
  const a = {"SECURITY GUARD":"Security Guards","HOUSING BOARD & NRDA":"Housing Board & NRDA","EMERGENCY HELPLINE":"Emergency Helpline","HOSPITALS":"Hospitals","DAILY HELPS":"Daily Helps"};
  return a[n] || n.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
}
function canonicalSectionName(v, fallback) {
  const h = String(v||"").trim().toUpperCase();
  if (!h) return fallback || SECTION_ORDER[0];
  if (h.includes("SECURITY")) return "SECURITY GUARD";
  if (h.includes("HOUSING")||h.includes("NRDA")||h.includes("CGSPDCL")) return "HOUSING BOARD & NRDA";
  if (h.includes("EMERGENCY")||h.includes("POLICE")||h.includes("FIRE")) return "EMERGENCY HELPLINE";
  if (h.includes("HOSPITAL")||h.includes("AMBULANCE")||h.includes("BALCO")) return "HOSPITALS";
  if (h.includes("DAILY")) return "DAILY HELPS";
  return fallback || h;
}
function buildSections(rows) {
  const map = new Map(SECTION_ORDER.map(t => [t, {title:t, contacts:[]}]));
  let cur = SECTION_ORDER[0];
  rows.forEach(cols => {
    while (cols.length < 3) cols.push("");
    const work=(cols[0]||"").trim(), number=(cols[1]||"").trim(), name=(cols[2]||"").trim();
    if (!work && !number && !name) return;
    if (work && !number && !name) { cur = canonicalSectionName(work, cur); return; }
    const sec = canonicalSectionName(cur, cur);
    if (!map.has(sec)) map.set(sec, {title:sec, contacts:[]});
    map.get(sec).contacts.push({work, number, name});
  });
  return SECTION_ORDER.map(t => map.get(t)).filter(s => s && s.contacts.length);
}

/* ── Filtered sections helper ── */
function filteredSections() {
  const q = searchQuery.trim().toLowerCase();
  let secs = activeSectionIndex === 0
    ? contactSections
    : [contactSections[activeSectionIndex - 1]].filter(Boolean);
  if (!q) return secs;
  return secs.map(s => ({
    ...s,
    contacts: s.contacts.filter(c =>
      `${c.work} ${c.name} ${c.number}`.toLowerCase().includes(q)
    )
  })).filter(s => s.contacts.length);
}

/* ── DESKTOP: render category tabs ── */
function renderDesktopTabs() {
  const allCount = contactSections.reduce((t,s) => t+s.contacts.length, 0);
  const tabs = [{label:"All", count:allCount}, ...contactSections.map(s => ({
    label: (SECTION_META[s.title]?.label || titleCase(s.title)),
    count: s.contacts.length
  }))];
  document.getElementById("contactTabs").innerHTML = tabs.map((t,i) => `
    <button class="cat-tab${i===activeSectionIndex?" active":""}" type="button" data-idx="${i}">
      ${escapeHtml(t.label)}<span class="cat-cnt">${t.count}</span>
    </button>`).join("");
}

/* ── DESKTOP: render section cards ── */
function renderDesktopSections() {
  const secs = filteredSections();
  const wrap = document.getElementById("sections");
  const total = secs.reduce((t,s) => t+s.contacts.length, 0);
  const el = document.getElementById("metaInfo");
  if (el) el.textContent = searchQuery ? `${total} result${total!==1?"s":""}` : "";
  if (!secs.length) { wrap.innerHTML = emptyHTML(false); return; }
  wrap.innerHTML = secs.map((s, si) => {
    const m = SECTION_META[s.title] || {cls:"si-blue", emoji:"📋", label:titleCase(s.title)};
    return `<div class="section-card" style="animation-delay:${si*55}ms">
      <div class="section-head">
        <div class="section-icon ${m.cls}">${m.emoji}</div>
        <div class="section-head-text">
          <div class="section-title-txt">${escapeHtml(m.label)}</div>
        </div>
        <span class="section-badge">${s.contacts.length} contact${s.contacts.length!==1?"s":""}</span>
      </div>
      <table class="ctable">
        <thead><tr>
          <th style="width:34%">Contact Work</th>
          <th style="width:22%">Number</th>
          <th style="width:26%">Name</th>
          <th style="width:18%">Call</th>
        </tr></thead>
        <tbody>
          ${s.contacts.map(c => {
            const ph = normalizePhone(c.number);
            return `<tr>
              <td>${escapeHtml(c.work)}</td>
              <td>${ph ? `<a class="num-link" href="tel:${ph}">${escapeHtml(c.number)}</a>` : escapeHtml(c.number)||"—"}</td>
              <td>${escapeHtml(c.name)||"—"}</td>
              <td>${ph
                ? `<a class="call-chip" href="tel:${ph}"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 11.5c0 .3-.06.6-.2.87a2.5 2.5 0 0 1-.6.8A3.9 3.9 0 0 1 10.7 14a10.9 10.9 0 0 1-4.5-1.23 10.8 10.8 0 0 1-3.17-3.17A10.9 10.9 0 0 1 1.8 4.3c0-.4.1-.8.33-1.17.2-.4.5-.74.87-.97A2.5 2.5 0 0 1 4.33 2c.34 0 .68.07.96.2.32.15.6.38.8.67l2 2.83c.2.27.3.56.3.83 0 .32-.1.64-.26.93-.17.3-.4.57-.68.8l-.8.8c-.03.04-.05.1-.05.15 0 .08.03.16.07.23.35.58.76 1.12 1.2 1.6.5.46 1.02.87 1.6 1.2.08.04.16.07.24.07.06 0 .12-.02.16-.06l.8-.8c.23-.27.5-.5.8-.67.3-.16.6-.24.93-.24.27 0 .56.1.83.3l2.83 2c.3.2.52.48.67.8.13.28.2.62.2.96z"/></svg>Call</a>`
                : `<span class="call-chip disabled">N/A</span>`}
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>`;
  }).join("");
}

/* ── MOBILE: render category strip ── */
function renderMobileCats() {
  const strip = document.getElementById("mobCatStrip");
  const allCount = contactSections.reduce((t,s) => t+s.contacts.length, 0);
  const cats = [{label:"All", count:allCount}, ...contactSections.map(s => ({
    label: SECTION_META[s.title]?.label || titleCase(s.title),
    count: s.contacts.length
  }))];
  strip.innerHTML = cats.map((c,i) =>
    `<button class="mob-cat-btn${i===activeSectionIndex?" active":""}" type="button" data-idx="${i}">${escapeHtml(c.label)} (${c.count})</button>`
  ).join("");
}

/* ── MOBILE: render contact list ── */
function renderMobileContacts() {
  const secs = filteredSections();
  const wrap = document.getElementById("mobileContactList");
  if (!secs.length) { wrap.innerHTML = emptyHTML(false); return; }
  const isSingle = secs.length === 1;
  wrap.innerHTML = secs.map(s => {
    const m = SECTION_META[s.title] || {mcls:"mav-blue", emoji:"📋", label:titleCase(s.title)};
    const label = isSingle ? "" :
      `<div class="mob-sec-label">${escapeHtml(m.label)}</div>`;
    const cards = s.contacts.map((c, ci) => {
      const ph = normalizePhone(c.number);
      return `<div class="mob-contact-card" style="animation-delay:${ci*28}ms">
        <div class="mob-avatar ${m.mcls}">${m.emoji}</div>
        <div class="mob-info">
          <div class="mob-work">${escapeHtml(c.work)}</div>
          ${c.name ? `<div class="mob-name">${escapeHtml(c.name)}</div>` : ""}
          ${ph ? `<div class="mob-num">${escapeHtml(c.number)}</div>` : ""}
        </div>
        <a class="mob-call-btn${ph?"":" disabled"}" href="${ph?`tel:${ph}`:"#"}" aria-label="Call ${escapeHtml(c.work)}">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 11.5c0 .3-.06.6-.2.87a2.5 2.5 0 0 1-.6.8A3.9 3.9 0 0 1 10.7 14a10.9 10.9 0 0 1-4.5-1.23 10.8 10.8 0 0 1-3.17-3.17A10.9 10.9 0 0 1 1.8 4.3c0-.4.1-.8.33-1.17.2-.4.5-.74.87-.97A2.5 2.5 0 0 1 4.33 2c.34 0 .68.07.96.2.32.15.6.38.8.67l2 2.83c.2.27.3.56.3.83 0 .32-.1.64-.26.93-.17.3-.4.57-.68.8l-.8.8c-.03.04-.05.1-.05.15 0 .08.03.16.07.23.35.58.76 1.12 1.2 1.6.5.46 1.02.87 1.6 1.2.08.04.16.07.24.07.06 0 .12-.02.16-.06l.8-.8c.23-.27.5-.5.8-.67.3-.16.6-.24.93-.24.27 0 .56.1.83.3l2.83 2c.3.2.52.48.67.8.13.28.2.62.2.96z"/></svg>
        </a>
      </div>`;
    }).join("");
    return label + cards;
  }).join("");
}

function emptyHTML(isErr) {
  return `<div class="empty-state">
    <div class="empty-icon${isErr?" err":""}">
      <svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="8" r="7"/><line x1="8" y1="5" x2="8" y2="8.5"/><circle cx="8" cy="11.5" r="0.5" fill="currentColor"/></svg>
    </div>
    <div class="empty-title${isErr?" err":""}">No contacts found</div>
    <div class="empty-sub">Try adjusting your search or selecting a different category.</div>
  </div>`;
}

function renderAll() {
  renderDesktopTabs();
  renderDesktopSections();
  renderMobileCats();
  renderMobileContacts();
  const total = contactSections.reduce((t,s) => t+s.contacts.length, 0);
  const el = document.getElementById("navEmergency");
  if (el) el.textContent = total;
}

/* ── Load contacts (original working logic) ── */
async function loadEmergencyContacts() {
  // Show loading
  const loadHTML = `<div class="empty-state">
    <div class="empty-icon"><svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 4v4l2.5 2.5"/></svg></div>
    <div class="empty-title">Loading contacts…</div>
    <div class="empty-sub">Fetching from Google Sheets</div>
  </div>`;
  document.getElementById("sections").innerHTML = loadHTML;
  document.getElementById("mobileContactList").innerHTML = loadHTML;

  try {
    // Try multiple URL formats for reliability
    const urls = [
      `https://docs.google.com/spreadsheets/d/${CONTACT_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(CONTACT_TAB_NAME)}`,
      `https://docs.google.com/spreadsheets/d/${CONTACT_SHEET_ID}/export?format=csv&sheet=${encodeURIComponent(CONTACT_TAB_NAME)}`,
      `https://docs.google.com/spreadsheets/d/${CONTACT_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(CONTACT_TAB_NAME.replace(/-/g," "))}`,
    ];
    let csv = "";
    for (const url of urls) {
      try {
        const resp = await fetch(url, {cache:"no-cache"});
        const text = await resp.text();
        const preview = text.trim().slice(0, 200).toLowerCase();
        if (!text.trim() || preview.startsWith("<!doctype html") || preview.includes("<html") ||
            preview.includes("google.visualization.query.setresponse") || text.includes("File not found")) continue;
        csv = text; break;
      } catch(_) {}
    }
    if (!csv) throw new Error("Unable to load sheet. Ensure the Google Sheet is shared publicly (Anyone with link → Viewer).");

    // Parse CSV — skip header row
    const allRows = csv.split(/\r?\n/).filter(l => l.trim()).map(parseCSVLine);
    if (allRows.length < 2) throw new Error("Sheet appears empty.");
    const rows = allRows.slice(1); // skip header

    contactSections = buildSections(rows);
    activeSectionIndex = 0;
    renderAll();
  } catch(e) {
    const errHTML = `<div class="empty-state">
      <div class="empty-icon err"><svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="8" r="7"/><line x1="8" y1="5" x2="8" y2="8.5"/><circle cx="8" cy="11.5" r="0.5" fill="currentColor"/></svg></div>
      <div class="empty-title err">Unable to load contacts</div>
      <div class="empty-sub">${escapeHtml(e.message)}</div>
      <div class="empty-sub" style="margin-top:10px;font-size:0.72rem;color:var(--ink-4)">
        Check: <strong>File → Share → Anyone with the link → Viewer</strong>
      </div>
      <button class="retry-btn" onclick="loadEmergencyContacts()">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M1.5 8A6.5 6.5 0 0 1 13.9 5M14.5 8A6.5 6.5 0 0 1 2.1 11"/><polyline points="13,2 14.5,5 11,5"/><polyline points="3,14 1.5,11 5,11"/></svg>
        Retry
      </button>
    </div>`;
    document.getElementById("sections").innerHTML = errHTML;
    document.getElementById("mobileContactList").innerHTML = errHTML;
  }
}

/* ── Search ── */
function applySearch(q) {
  searchQuery = q || "";
  renderDesktopSections();
  renderMobileContacts();
}
document.getElementById("contactSearchInput").addEventListener("input", e => applySearch(e.target.value));
document.getElementById("searchMob").addEventListener("input", e => applySearch(e.target.value));

/* ── Desktop category tabs ── */
document.getElementById("contactTabs").addEventListener("click", e => {
  const btn = e.target.closest(".cat-tab");
  if (!btn) return;
  activeSectionIndex = Number(btn.dataset.idx || 0);
  renderAll();
});

/* ── Mobile category strip ── */
document.getElementById("mobCatStrip").addEventListener("click", e => {
  const btn = e.target.closest(".mob-cat-btn");
  if (!btn) return;
  activeSectionIndex = Number(btn.dataset.idx || 0);
  renderAll();
});

/* ── Mobile search toggle ── */
document.getElementById("mobSearchToggle").addEventListener("click", () => {
  const bar = document.getElementById("mobSearchBar");
  bar.classList.toggle("visible");
  if (bar.classList.contains("visible")) document.getElementById("searchMob").focus();
});

/* ── Dropdowns ── */
function setupDD(togId, ddId) {
  const tog = document.getElementById(togId), dd = document.getElementById(ddId);
  if (!tog || !dd) return;
  tog.addEventListener("click", e => {
    e.stopPropagation();
    const o = dd.classList.toggle("open");
    tog.setAttribute("aria-expanded", o ? "true" : "false");
  });
}
setupDD("profileTogDesk", "pdDesk");
setupDD("profileTogMob", "pdMob");
document.addEventListener("click", () => {
  document.querySelectorAll(".profile-dropdown").forEach(d => d.classList.remove("open"));
  document.querySelectorAll("[aria-expanded]").forEach(b => b.setAttribute("aria-expanded","false"));
});

/* ── Logout ── */
["logoutDesk","logoutMob"].forEach(id => {
  const btn = document.getElementById(id);
  if (btn) btn.addEventListener("click", () => {
    sessionStorage.removeItem(AUTH_SESSION_KEY);
    window.location.href = "index.html";
  });
});

/* ── Init ── */
loadEmergencyContacts();
</script>
</body>
</html>
