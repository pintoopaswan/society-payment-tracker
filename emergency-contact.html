<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Emergency Contacts</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f3f7fb;
  --card: #fff;
  --line: #d6e0ec;
  --brand: #1f5ea8;
  --brand-dark: #123d70;
  --ink: #17314f;
  --mobile-ink: #14313b;
  --call: #50af49;
  --ease-standard: cubic-bezier(0.22, 0.61, 0.36, 1);
  --accent: #1f5ea8;
  --accent-soft: #dfefff;
  --accent-text: #214d7c;
  --success: #3da765;
  --success-soft: #e4f7eb;
  --success-text: #1d6f45;
  --success-border: #b9e0c8;
}
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: radial-gradient(circle at 20% 20%, #d9ecff 0%, #f3f7fb 60%); color: var(--ink); min-height: 100vh; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; }
.app-header { background: linear-gradient(120deg, #153a66, #1f5ea8 52%, #2b7b64); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 18px 40px rgba(13, 36, 66, 0.22); text-align: center; }
.app-header h1 { color: #fff; font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
.app-header p { color: #fff; font-size: 1rem; font-weight: 700; opacity: 0.92; letter-spacing: 0.03em; text-transform: uppercase; }
.nav-shell { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.08); display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
.mobile-brand-row { display: none; }
.mobile-menu-mark { display: none; }
.main-menu { list-style: none; display: flex; flex-wrap: wrap; gap: 10px; margin: 0; padding: 0; }
.main-menu a { text-decoration: none; color: #1f4f7e; border: 1px solid rgba(31, 94, 168, 0.16); background: #eef6ff; padding: 12px 16px; border-radius: 999px; font-weight: 700; font-size: 0.94rem; transition: all 0.22s ease; }
.main-menu a:hover { background: #dde9ff; transform: translateY(-1px); }
.main-menu a.active { background: var(--accent); border-color: var(--accent); color: #fff; }
#logoutBtn { border: none; background: transparent; color: #1f314a; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; width: 100%; text-align: left; }
.profile-menu { position: relative; }
.profile-button { width: 42px; height: 42px; border-radius: 50%; border: none; background: #1f5ea8; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(31, 94, 168, 0.18); }
.profile-dropdown { position: absolute; right: 0; top: calc(100% + 10px); background: #fff; border: 1px solid #d9e3ec; border-radius: 12px; box-shadow: 0 18px 40px rgba(31, 94, 168, 0.12); min-width: 140px; display: none; z-index: 20; }
.profile-dropdown.visible { display: block; }
.profile-dropdown button { width: 100%; border: none; background: transparent; padding: 12px 14px; text-align: left; color: #1f314a; font-weight: 700; cursor: pointer; }
.profile-dropdown button:hover { background: #eef4fb; }
.meta { margin: 10px 0 16px; color: #2a4a67; font-size: 14px; font-weight: 600; }
.error { color: #b00020; margin-bottom: 8px; }
.sections { display: grid; gap: 18px; }
.contact-section { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); border: 1px solid #dde6f2; }
.section-title { background: #1f2a3b; color: #fff; padding: 14px 16px; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.04em; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th, td { border-bottom: 1px solid #edf1f7; padding: 12px 14px; text-align: left; vertical-align: top; }
th { color: #17314f; background: #f4f8fc; text-transform: uppercase; font-size: 0.78rem; letter-spacing: 0.04em; }
td { color: #1d3249; font-size: 0.95rem; }
tr:last-child td { border-bottom: 0; }
.number-link { color: #1f5ea8; font-weight: 700; text-decoration: none; }
.desktop-call { display: inline-flex; align-items: center; justify-content: center; min-height: 32px; min-width: 78px; border-radius: 999px; background: var(--success-soft); color: var(--success-text); font-weight: 800; text-decoration: none; border: 1px solid var(--success-border); font-size: 0.82rem; }
.desktop-call.disabled { background: #f0f2f5; border-color: #dee3ea; color: #8a95a3; pointer-events: none; }
.empty-state { background: #fff; border: 1px solid #dde6f2; border-radius: 12px; padding: 28px; color: #567; text-align: center; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06); }
.mobile-page-header, .contact-tabs, .mobile-contact-list { display: none; }
.dashboard-metrics { display: grid; grid-template-columns: repeat(4, minmax(160px, 1fr)); gap: 12px; margin: 0 0 14px; }
.metric-card { background: #fff; border: 1px solid #d8e4ef; border-radius: 14px; padding: 14px 16px; box-shadow: 0 10px 24px rgba(16, 42, 72, 0.08); }
.metric-label { font-size: 0.74rem; color: #486481; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 800; }
.metric-value { margin-top: 6px; font-size: 1.3rem; font-weight: 800; color: #16324f; }
.metric-sub { margin-top: 3px; color: #6a7d91; font-size: 0.82rem; font-weight: 600; }
.menu-badge { margin-left: 8px; min-width: 22px; height: 22px; border-radius: 999px; padding: 0 7px; font-size: 0.75rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent-text); }
.main-menu a.active .menu-badge { background: rgba(255,255,255,0.24); color: #fff; }
.contact-icon, .call-button { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; }
.contact-icon { width: 44px; height: 44px; color: #60636a; background: #fff; border: 2px solid #c9ccd2; position: relative; }
.contact-icon::before { content: ""; position: absolute; top: 9px; left: 50%; width: 13px; height: 13px; border: 3px solid currentColor; border-radius: 50%; transform: translateX(-50%); }
.contact-icon::after { content: ""; position: absolute; left: 50%; bottom: 9px; width: 24px; height: 12px; border: 3px solid currentColor; border-bottom: 0; border-radius: 999px 999px 0 0; transform: translateX(-50%); }
.contact-icon.muted { color: #b7bbc2; background: #f5f6f8; border-color: #e1e3e7; }
.call-button { width: 58px; height: 58px; background: var(--call); color: #fff; text-decoration: none; font-size: 1.8rem; line-height: 1; }
.call-button.disabled { background: #d7dce2; pointer-events: none; }
@media (max-width: 768px) {
  body { padding: 0; background: radial-gradient(circle at 20% 20%, #d9ecff 0%, #f3f7fb 60%); color: #242424; }
  .container { max-width: none; }
  .nav-shell { position: sticky; top: 0; z-index: 40; }
  .app-header, .nav-shell, .meta, .sections { display: none; }
  .error { padding: 16px 18px; margin: 0; font-size: 0.95rem; }
  .mobile-page-header {
    display: grid;
    grid-template-columns: 52px 1fr 52px;
    align-items: center;
    min-height: 78px;
    padding: 14px 18px 10px;
    border-bottom: 0;
    background: linear-gradient(120deg, #153a66, #1f5ea8 52%, #2b7b64);
    box-shadow: 0 12px 24px rgba(13, 36, 66, 0.2);
  }
  .back-link { color: #fff; text-decoration: none; font-size: 3rem; line-height: 1; font-weight: 300; transform: translateY(-2px); }
  .mobile-page-title { text-align: center; color: #fff; font-size: 1.2rem; font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; }
  .contact-tabs {
    position: relative;
    display: flex;
    overflow-x: auto;
    gap: 0;
    padding: 16px 18px 0;
    background: #f7fbff;
    scrollbar-width: none;
  }
  .contact-tabs::after {
    content: "";
    position: absolute;
    left: 28px;
    right: 28px;
    bottom: 0;
    height: 6px;
    background: #f1f1f1;
  }
  .contact-tabs::-webkit-scrollbar { display: none; }
  .contact-tab {
    position: relative;
    flex: 0 0 50%;
    min-width: 164px;
    border: 0;
    background: #fff;
    color: #252525;
    padding: 0 8px 16px;
    font-size: 1.08rem;
    font-weight: 650;
    text-align: center;
    white-space: nowrap;
  }
  .contact-tab.active::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 5px;
    background: var(--mobile-ink);
    z-index: 1;
  }
  .mobile-contact-list { display: block; padding: 20px 16px 8px; background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%); }
  .mobile-contact-row {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    padding: 12px;
    margin-bottom: 10px;
    border: 1px solid #dde8f3;
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 8px 18px rgba(17, 42, 70, 0.07);
    transition: transform 180ms var(--ease-standard), box-shadow 180ms var(--ease-standard);
  }
  .mobile-contact-row:active { transform: scale(0.995); box-shadow: 0 6px 14px rgba(17, 42, 70, 0.09); }
  .mobile-contact-name { color: #173a63; font-size: 1rem; line-height: 1.2; font-weight: 800; overflow-wrap: anywhere; }
  .mobile-contact-block { color: #5e5e5e; font-size: 0.86rem; line-height: 1.25; margin-top: 6px; overflow-wrap: anywhere; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .contact-icon { width: 40px; height: 40px; border-width: 1px; background: #f2f7fc; color: #5f6f81; }
  .contact-icon::before { top: 9px; width: 10px; height: 10px; border-width: 2px; }
  .contact-icon::after { bottom: 9px; width: 18px; height: 9px; border-width: 2px; border-bottom: 0; }
  .call-button { width: auto; height: 36px; font-size: 0.82rem; font-weight: 800; border-radius: 999px; padding: 0 12px; background: var(--success); min-width: 68px; }
  .call-button::after { content: "Call"; margin-left: 6px; }
  .call-button.disabled::after { content: "N/A"; margin-left: 0; }
  .dashboard-metrics { display: none; }
}
@media (max-width: 560px) {
  .mobile-page-header { grid-template-columns: 44px 1fr 44px; min-height: 76px; padding-left: 16px; padding-right: 16px; }
  .mobile-page-title { font-size: 1.3rem; }
  .contact-tabs { padding-left: 18px; padding-right: 18px; }
  .contact-tabs::after { left: 18px; right: 18px; }
  .contact-tab { min-width: 160px; font-size: 1rem; }
  .mobile-contact-list { padding: 16px 14px 8px; }
  .mobile-contact-row { grid-template-columns: 40px minmax(0, 1fr) auto; gap: 8px; padding: 10px; margin-bottom: 9px; }
  .contact-icon { width: 36px; height: 36px; }
  .call-button { height: 34px; font-size: 0.78rem; padding: 0 10px; min-width: 62px; }
  .mobile-contact-name { font-size: 0.96rem; }
}
</style>
</head>
<body>
<div class="container">
  <div class="app-header">
    <h1>MIG Society, Sector-29</h1>
    <p>Emergency Contacts</p>
  </div>

  <div class="nav-shell">
    <div class="mobile-brand-row">
      <div class="mobile-menu-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="mobile-brand-title">MIG-1 Society</div>
    </div>
    <ul class="main-menu">
      <li><a href="index.html">Payments</a></li>
      <li><a href="owner-tenant.html">Residents</a></li>
      <li><a class="active" href="emergency-contact.html">Emergency Contact <span class="menu-badge" id="emergencyNavBadge">0</span></a></li>
    </ul>
    <div class="profile-menu">
      <button id="profileToggle" class="profile-button" type="button" aria-haspopup="true" aria-expanded="false">A</button>
      <div class="profile-dropdown" id="profileDropdown">
        <button id="logoutBtn" type="button">Logout</button>
      </div>
    </div>
  </div>

  <div class="mobile-page-header">
    <a class="back-link" href="index.html" aria-label="Back">‹</a>
    <div class="mobile-page-title">Emergency contacts</div>
    <div></div>
  </div>
  <div class="contact-tabs" id="contactTabs"></div>
  <div class="dashboard-metrics">
    <div class="metric-card"><div class="metric-label">Total Contacts</div><div class="metric-value" id="metricTotalContacts">0</div><div class="metric-sub">All emergency entries</div></div>
    <div class="metric-card"><div class="metric-label">Sections</div><div class="metric-value" id="metricSections">0</div><div class="metric-sub">Contact categories</div></div>
    <div class="metric-card"><div class="metric-label">Dial Ready</div><div class="metric-value" id="metricDialReady">0</div><div class="metric-sub">Contacts with phone numbers</div></div>
    <div class="metric-card"><div class="metric-label">Missing Number</div><div class="metric-value" id="metricMissing">0</div><div class="metric-sub">Need update</div></div>
  </div>

  <div class="meta" id="metaInfo">Loading contacts...</div>
  <div class="error" id="errorText"></div>
  <div class="sections" id="sections"></div>
  <div class="mobile-contact-list" id="mobileContactList"></div>
</div>

<script>
const AUTH_SESSION_KEY = "society_dashboard_auth";
if (sessionStorage.getItem(AUTH_SESSION_KEY) !== "true") sessionStorage.setItem(AUTH_SESSION_KEY, "true");

const CONTACT_SHEET_ID = "15iii2nw4THbf-t-TdYNfj5WW2Aw4selhvfwu64YzisE";
const CONTACT_TAB_NAME = "emergency-contacts";
const SECTION_ORDER = ["SECURITY GUARD", "HOUSING BOARD & NRDA", "EMERGENCY HELPLINE", "HOSPITALS", "DAILY HELPS"];
let contactSections = [];
let activeSectionIndex = 0;

function escapeHtml(value) {
  return String(value || "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
}
function parseCSVLine(line) {
  const cols = [];
  let current = "", inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const char = line[i], next = line[i + 1];
    if (char === '"' && inQuotes && next === '"') { current += '"'; i += 1; }
    else if (char === '"') inQuotes = !inQuotes;
    else if (char === "," && !inQuotes) { cols.push(current); current = ""; }
    else current += char;
  }
  cols.push(current);
  return cols.map(col => col.trim());
}
function normalizePhone(value) { return String(value || "").replace(/[^\d+]/g, ""); }
function titleCase(value) {
  const normalized = String(value || "").trim().toUpperCase();
  const aliases = {
    "SECURITY GUARD": "Security Guards",
    "HOUSING BOARD & NRDA": "Housing Board & NRDA",
    "EMERGENCY HELPLINE": "Emergency Helpline",
    "HOSPITALS": "Hospitals",
    "DAILY HELPS": "Daily Helps",
  };
  if (aliases[normalized]) return aliases[normalized];
  return normalized.toLowerCase().replace(/\b\w/g, char => char.toUpperCase());
}
function canonicalSectionName(value, fallback) {
  const heading = String(value || "").trim().toUpperCase();
  if (!heading) return fallback || SECTION_ORDER[0];
  if (heading.includes("SECURITY")) return "SECURITY GUARD";
  if (heading.includes("HOUSING") || heading.includes("NRDA") || heading.includes("CGSPDCL")) return "HOUSING BOARD & NRDA";
  if (heading.includes("EMERGENCY") || heading.includes("POLICE") || heading.includes("FIRE")) return "EMERGENCY HELPLINE";
  if (heading.includes("HOSPITAL") || heading.includes("AMBULANCE") || heading.includes("BALCO")) return "HOSPITALS";
  if (heading.includes("DAILY")) return "DAILY HELPS";
  return fallback || heading;
}
function buildSections(rows) {
  const sectionMap = new Map(SECTION_ORDER.map(title => [title, { title, contacts: [] }]));
  let currentTitle = SECTION_ORDER[0];
  rows.forEach(cols => {
    const work = cols[0] || "", number = cols[1] || "", name = cols[2] || "";
    if (!work && !number && !name) return;
    if (work && !number && !name) {
      currentTitle = canonicalSectionName(work, currentTitle);
      return;
    }
    const sectionTitle = canonicalSectionName(currentTitle, currentTitle);
    if (!sectionMap.has(sectionTitle)) {
      sectionMap.set(sectionTitle, { title: sectionTitle, contacts: [] });
    }
    sectionMap.get(sectionTitle).contacts.push({ work, number, name });
  });
  return SECTION_ORDER.map(title => sectionMap.get(title)).filter(section => section.contacts.length);
}
function renderWebSections() {
  const wrapper = document.getElementById("sections");
  if (!contactSections.length) {
    wrapper.innerHTML = `<div class="empty-state">No emergency contacts found.</div>`;
    return;
  }
  wrapper.innerHTML = contactSections.map(section => `
    <section class="contact-section">
      <h2 class="section-title">${escapeHtml(titleCase(section.title))}</h2>
      <table>
        <thead><tr><th>Contact Work</th><th>Contact Number</th><th>Contact Name</th><th>Quick Action</th></tr></thead>
        <tbody>
          ${section.contacts.map(contact => {
            const phone = normalizePhone(contact.number);
            const numberHtml = phone ? `<a class="number-link" href="tel:${phone}">${escapeHtml(contact.number)}</a>` : "";
            const actionHtml = phone ? `<a class="desktop-call" href="tel:${phone}">Call</a>` : `<span class="desktop-call disabled">N/A</span>`;
            return `<tr><td>${escapeHtml(contact.work)}</td><td>${numberHtml}</td><td>${escapeHtml(contact.name)}</td><td>${actionHtml}</td></tr>`;
          }).join("")}
        </tbody>
      </table>
    </section>
  `).join("");
}
function renderMobileTabs() {
  const tabs = document.getElementById("contactTabs");
  const allCount = contactSections.reduce((total, section) => total + section.contacts.length, 0);
  const labels = [{ title: "All Contacts", count: allCount }, ...contactSections.map(section => ({ title: titleCase(section.title), count: section.contacts.length }))];
  tabs.innerHTML = labels.map((tab, index) => `<button class="contact-tab ${index === activeSectionIndex ? "active" : ""}" type="button" data-index="${index}">${escapeHtml(tab.title)} (${tab.count})</button>`).join("");
}
function getActiveContacts() {
  if (activeSectionIndex === 0) return contactSections.flatMap(section => section.contacts.map(contact => ({ ...contact, section: section.title })));
  const section = contactSections[activeSectionIndex - 1];
  return section ? section.contacts.map(contact => ({ ...contact, section: section.title })) : [];
}
function renderMobileContacts() {
  const wrapper = document.getElementById("mobileContactList");
  const contacts = getActiveContacts();
  if (!contacts.length) {
    wrapper.innerHTML = `<div class="empty-state">No emergency contacts found.</div>`;
    return;
  }
  wrapper.innerHTML = contacts.map(contact => {
    const phone = normalizePhone(contact.number);
    const subtitle = contact.name ? `<span>${escapeHtml(contact.name)}</span>` : "";
    return `
      <div class="mobile-contact-row">
        <span class="contact-icon ${phone ? "" : "muted"}" aria-hidden="true"></span>
        <div>
          <div class="mobile-contact-name">${escapeHtml(contact.work)}</div>
          <div class="mobile-contact-block">${subtitle}</div>
        </div>
        <a class="call-button ${phone ? "" : "disabled"}" href="${phone ? `tel:${phone}` : "#"}" aria-label="Call ${escapeHtml(contact.work)}">☎</a>
      </div>
    `;
  }).join("");
}
function renderContacts() {
  renderWebSections();
  renderMobileTabs();
  renderMobileContacts();
  const count = contactSections.reduce((total, section) => total + section.contacts.length, 0);
  const dialReady = contactSections.reduce((total, section) => total + section.contacts.filter(contact => normalizePhone(contact.number)).length, 0);
  const missing = Math.max(count - dialReady, 0);
  document.getElementById("metricTotalContacts").textContent = count.toLocaleString("en-IN");
  document.getElementById("metricSections").textContent = contactSections.length.toLocaleString("en-IN");
  document.getElementById("metricDialReady").textContent = dialReady.toLocaleString("en-IN");
  document.getElementById("metricMissing").textContent = missing.toLocaleString("en-IN");
  document.getElementById("emergencyNavBadge").textContent = count.toLocaleString("en-IN");
  document.getElementById("metaInfo").textContent = `Showing ${count} contacts in ${contactSections.length} sections`;
}
async function loadEmergencyContacts() {
  const errorText = document.getElementById("errorText");
  errorText.textContent = "";
  try {
    const url = `https://docs.google.com/spreadsheets/d/${CONTACT_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(CONTACT_TAB_NAME)}`;
    const response = await fetch(url);
    const csv = await response.text();
    const preview = csv.trim().slice(0, 120).toLowerCase();
    if (!csv.trim() || preview.startsWith("<!doctype html") || preview.includes("google.visualization.query.setresponse")) {
      throw new Error("Invalid sheet response. Check sheet ID/tab name and sharing permissions.");
    }
    const rows = csv.split(/\r?\n/).filter(line => line.trim()).map(parseCSVLine);
    contactSections = buildSections(rows);
    activeSectionIndex = 0;
    renderContacts();
  } catch (error) {
    errorText.textContent = error.message;
    document.getElementById("metaInfo").textContent = "Failed to load contacts";
    document.getElementById("sections").innerHTML = "";
    document.getElementById("mobileContactList").innerHTML = "";
  }
}

document.getElementById("contactTabs").addEventListener("click", event => {
  const tab = event.target.closest(".contact-tab");
  if (!tab) return;
  activeSectionIndex = Number(tab.dataset.index || 0);
  renderMobileTabs();
  renderMobileContacts();
});
document.getElementById("logoutBtn").addEventListener("click", () => { sessionStorage.removeItem(AUTH_SESSION_KEY); window.location.href = "index.html"; });
const profileToggle = document.getElementById("profileToggle");
const profileDropdown = document.getElementById("profileDropdown");
if (profileToggle && profileDropdown) {
  profileToggle.addEventListener("click", event => {
    event.stopPropagation();
    const visible = profileDropdown.classList.toggle("visible");
    profileToggle.setAttribute("aria-expanded", visible);
  });
  document.addEventListener("click", event => {
    if (!event.target.closest(".profile-menu")) {
      profileDropdown.classList.remove("visible");
      profileToggle.setAttribute("aria-expanded", "false");
    }
  });
}
loadEmergencyContacts();
</script>
</body>
</html>
