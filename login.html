<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · MIG Society</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<style>
  :root{
    --blue-700:#1d4ed8;--blue-600:#2563eb;--blue-500:#3b82f6;--blue-50:#eff6ff;
    --ink:#0f172a;--ink-2:#475569;--ink-3:#94a3b8;
    --line:#e2e8f0;--red-500:#f43f5e;--red-50:#fff1f2;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'DM Sans',sans-serif;color:var(--ink);
    background:
      radial-gradient(1100px 600px at 15% -10%, var(--blue-50), transparent),
      radial-gradient(900px 500px at 110% 110%, #eef2ff, transparent),
      #f8fafc;
    padding:24px;
  }
  .card{
    width:100%;max-width:380px;background:#fff;border:1px solid var(--line);
    border-radius:20px;padding:36px 32px 32px;
    box-shadow:0 20px 50px rgba(15,23,42,0.08),0 2px 8px rgba(15,23,42,0.04);
    text-align:center;
  }
  .logo{
    width:52px;height:52px;margin:0 auto 18px;border-radius:14px;
    background:linear-gradient(135deg,var(--blue-600),var(--blue-700));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(37,99,235,0.35);
  }
  .logo svg{color:#fff}
  h1{font-family:'Fraunces',serif;font-size:1.4rem;font-weight:700;margin:0 0 4px;letter-spacing:-0.02em}
  .sub{font-size:0.85rem;color:var(--ink-2);margin:0 0 28px}
  .gsi-slot{display:flex;justify-content:center;min-height:44px}
  .status{font-size:0.8rem;color:var(--ink-3);margin-top:16px}
  .error{
    display:none;text-align:left;font-size:0.8rem;color:var(--red-500);
    background:var(--red-50);border:1px solid rgba(244,63,94,0.25);
    border-radius:10px;padding:10px 12px;margin-top:16px;line-height:1.4;
  }
  .error.show{display:block}
  .note{font-size:0.72rem;color:var(--ink-3);margin-top:24px;line-height:1.5}
  .spinner{
    width:18px;height:18px;border-radius:50%;
    border:2.5px solid var(--line);border-top-color:var(--blue-600);
    animation:spin 0.8s linear infinite;margin:0 auto;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
  /* Visible focus ring for any native focusable element on this page (the
     Google-rendered sign-in button manages its own focus styling inside
     its iframe — this covers everything else, and is here defensively so
     the page never relies on a browser's default outline being visible
     against this custom background). */
  a:focus-visible, button:focus-visible{
    outline:2px solid var(--blue-600); outline-offset:2px; border-radius:6px;
  }
</style>
</head>
<body>
  <main class="card" aria-labelledby="loginHeading">
    <div class="logo" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="8" width="16" height="11" rx="2"/><path d="M6 8V6a4 4 0 0 1 8 0v2"/>
      </svg>
    </div>
    <h1 id="loginHeading">MIG Society</h1>
    <p class="sub">Sector-29 · Guard Payment Tracker</p>

    <div class="gsi-slot" id="gsiBtn" role="status" aria-live="polite">
      <span class="sr-only" id="gsiStatusText">Loading sign-in options…</span>
      <div class="spinner" aria-hidden="true"></div>
    </div>
    <div class="error" id="loginError" role="alert" aria-live="assertive"></div>

    <p class="note">Sign in with the Google account your society admin has approved. Every page and every change is verified against that account — there's no separate password.</p>
  </main>

<script>
const GOOGLE_OAUTH_CLIENT_ID = CONFIG.google.oauthClientId;
const SESSION_KEY = "society_auth_session";

// Mirrors ALLOWED_USERS in guard-payment-write-apps-script.gs (via
// config.js — see the note at the top of that file about why this can't
// be the same file the server reads). This check is a UX nicety only
// (skip the "signed in but not on the list" surprise a step later) — it
// is NOT the security boundary. The real check happens server-side, on
// every single request, against the server's own copy of this list.
const ALLOWED_USERS = CONFIG.allowedUsers;

function decodeJwtPayload(jwt){
  try{
    const b64 = jwt.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
    const json = decodeURIComponent(atob(b64).split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""));
    return JSON.parse(json);
  }catch{ return {}; }
}

// Only allow redirecting back to a plain same-folder .html filename that
// was already given to us — never an absolute/external URL — so this
// can't be turned into an open redirect via the ?next= param.
function safeNext(){
  const p = new URLSearchParams(location.search).get("next") || "index.html";
  return /^[a-zA-Z0-9_-]+\.html$/.test(p) ? p : "index.html";
}

function showError(msg){
  const el = document.getElementById("loginError");
  el.textContent = msg;
  el.classList.add("show");
}

function clearError(){
  document.getElementById("loginError").classList.remove("show");
}

function handleCredential(response){
  clearError();
  const idToken = response.credential;
  const claims = decodeJwtPayload(idToken);
  const email = (claims.email || "").toLowerCase();

  if(!email){
    showError("Couldn't read that Google account. Please try again.");
    return;
  }
  if(!ALLOWED_USERS.includes(email)){
    showError(`${email} isn't on the society's access list yet. Contact your admin if this seems wrong.`);
    try{ window.google?.accounts?.id?.disableAutoSelect(); }catch{}
    return;
  }

  const session = { idToken, email, name: claims.name || email, exp: claims.exp };
  try{
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
  }catch{
    showError("Couldn't start a session in this browser. Check that cookies/storage aren't blocked and try again.");
    return;
  }
  window.location.href = safeNext();
}

function init(attempt = 0){
  if(!window.google?.accounts?.id){
    if(attempt >= 30){ // ~9s of 300ms polls — give up and say so, rather than spinning forever
      const gsiSlot = document.getElementById("gsiBtn");
      if(gsiSlot) gsiSlot.innerHTML = "";
      showError("Couldn't reach Google's sign-in service. Check your connection (or whether your network blocks accounts.google.com) and reload this page.");
      return;
    }
    setTimeout(() => init(attempt + 1), 300);
    return;
  }
  document.getElementById("gsiBtn").innerHTML = "";
  google.accounts.id.initialize({
    client_id: GOOGLE_OAUTH_CLIENT_ID,
    callback: handleCredential,
    auto_select: true
  });
  google.accounts.id.renderButton(document.getElementById("gsiBtn"), {
    type: "standard", theme: "filled_blue", size: "large", shape: "pill",
    text: "signin_with", width: 280
  });
  google.accounts.id.prompt(); // silent sign-in for a returning, still-logged-in user
}
init();
</script>
</body>
</html>
