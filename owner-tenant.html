<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resident Details</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f3f7fb;
  --card: #fff;
  --line: #d6e0ec;
  --brand: #1f5ea8;
  --text: #17314f;
  --ease-standard: cubic-bezier(0.22, 0.61, 0.36, 1);
  --dur-fast: 180ms;
  --dur-med: 260ms;
  --accent: #1f5ea8;
  --accent-soft: #dfefff;
  --accent-text: #214d7c;
  --chip-owner-bg: #e6f0ff;
  --chip-owner-text: #184f91;
  --chip-owner-border: #bad2f4;
  --chip-tenant-bg: #e4f7eb;
  --chip-tenant-text: #1d6f45;
  --chip-tenant-border: #b9e0c8;
  --chip-pending-bg: #fbe9ec;
  --chip-pending-text: #8f2230;
  --chip-pending-border: #f0c6cd;
}
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: radial-gradient(circle at 20% 20%, #d9ecff 0%, #f3f7fb 60%); color: var(--text); min-height: 100vh; padding: 20px; }
body.modal-open { overflow: hidden; position: fixed; width: 100%; }
.container { max-width: 1300px; margin: 0 auto; }
.app-header { background: linear-gradient(120deg, #153a66, #1f5ea8 52%, #2b7b64); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 18px 40px rgba(13, 36, 66, 0.22); position: relative; display: flex; flex-direction: column; align-items: center; }
.header-title { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.header-title h1 { color: #fff; font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
.header-title p { color: #fff; margin-top: 0; font-size: 1rem; font-weight: 700; opacity: 0.92; letter-spacing: 0.03em; text-transform: uppercase; }
  .nav-shell { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.08); display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
.mobile-brand-row { display: none; }
.mobile-menu-mark { display: none; }
.main-menu { list-style: none; display: flex; flex-wrap: wrap; gap: 10px; margin: 0; padding: 0; }
  .main-menu a { text-decoration: none; color: #1f4f7e; border: 1px solid rgba(31, 94, 168, 0.16); background: #eef6ff; padding: 12px 16px; border-radius: 999px; font-weight: 700; font-size: 0.94rem; transition: all 0.22s ease; }
  .main-menu a:hover { background: #dde9ff; transform: translateY(-1px); }
  .main-menu a.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #logoutBtn { border: none; background: transparent; color: #1f314a; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; width: 100%; text-align: left; }
  .profile-menu { position: relative; }
  .profile-button { width: 42px; height: 42px; border-radius: 50%; border: none; background: #1f5ea8; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(31, 94, 168, 0.18); }
  .profile-dropdown { position: absolute; right: 0; top: calc(100% + 10px); background: #fff; border: 1px solid #d9e3ec; border-radius: 12px; box-shadow: 0 18px 40px rgba(31, 94, 168, 0.12); min-width: 140px; display: none; z-index: 20; }
  .profile-dropdown.visible { display: block; }
  .profile-dropdown button { width: 100%; border: none; background: transparent; padding: 12px 14px; text-align: left; color: #1f314a; font-weight: 700; cursor: pointer; }
  .profile-dropdown button:hover { background: #eef4fb; }
  .controls { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; background: var(--card); padding: 18px; border-radius: 16px; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.06); margin-bottom: 12px; }
  .search-bar { display: flex; gap: 10px; width: 100%; }
  .search-bar input { flex: 1; min-width: 0; }
  select, input { border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 0.95rem; background: #fff; color: #1f314a; }
.meta { margin: 10px 0; color: #2a4a67; font-size: 14px; font-weight: 600; }
.error { color: #b00020; margin-bottom: 8px; }
.table-wrap { background: #fff; border-radius: 12px; overflow: auto; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); max-height: 75vh; border: 1px solid #dde6f2; }
.card-list { display: none; margin-top: 16px; }
  .mobile-card { background: #fff; border-radius: 20px; border: 0; padding: 20px 22px; margin-bottom: 14px; box-shadow: 0 14px 30px rgba(27, 37, 54, 0.07); transition: box-shadow var(--dur-med) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard); }
  .mobile-card.expanded { box-shadow: 0 18px 34px rgba(27, 37, 54, 0.09); }
  .mobile-card-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; cursor: pointer; min-height: 60px; }
  .mobile-card-header .title { font-weight: 700; color: #202124; font-size: 1rem; line-height: 1.2; letter-spacing: 0; }
  .mobile-card-copy { min-width: 0; }
  .card-people { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; color: #646464; font-size: 0.92rem; font-weight: 400; line-height: 1.35; }
  .card-people .owner, .card-people .tenant { font-size: inherit; line-height: inherit; }
  .card-people .owner { color: inherit; font-weight: 400; }
  .card-people .tenant { color: inherit; }
  .toggle-icon { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #bdd4ea; background: #ecf5ff; color: transparent; display: grid; place-items: center; flex: 0 0 auto; position: relative; }
  .toggle-icon::before { content: ""; position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border-right: 2px solid #1f5ea8; border-bottom: 2px solid #1f5ea8; transform: translate(-50%, -62%) rotate(45deg); border-radius: 1px; transition: transform var(--dur-fast) var(--ease-standard); }
  .mobile-card.expanded .toggle-icon::before { transform: translate(-50%, -38%) rotate(-135deg); }
  .card-details { margin-top: 12px; padding-top: 0; border-top: 1px solid transparent; max-height: 0; opacity: 0; overflow: hidden; transition: max-height var(--dur-med) var(--ease-standard), opacity var(--dur-med) var(--ease-standard), padding-top var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard); }
  .mobile-card.expanded .card-details { max-height: 2200px; opacity: 1; padding-top: 18px; border-color: #eef0f4; }
  .detail-row { display: grid; grid-template-columns: minmax(96px, 0.45fr) minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 14px; margin-bottom: 10px; border: 1px solid #e5ebe8; border-radius: 16px; background: #f8faf9; box-shadow: 0 8px 18px rgba(27, 37, 54, 0.04); }
  .detail-row:last-child { margin-bottom: 0; }
.detail-key { font-size: 0.82rem; color: #686f78; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
.detail-value { font-size: 0.95rem; color: #202124; font-weight: 500; text-align: right; overflow-wrap: anywhere; }
.call-link { display: inline-flex; align-items: center; justify-content: flex-end; gap: 8px; color: inherit; text-decoration: none; font-weight: inherit; }
.call-link:hover { text-decoration: none; }
.call-icon { width: 28px; height: 28px; border-radius: 50%; background: #cfcfcf; color: #fff; display: inline-grid; place-items: center; font-size: 0.9rem; line-height: 1; font-weight: 700; flex: 0 0 auto; }
.edit-resident-btn { min-height: 32px; border: 1px solid #c6d9ee; background: #edf5ff; color: #1e5788; border-radius: 999px; padding: 0 12px; font-weight: 800; cursor: pointer; }
.edit-resident-btn:hover { background: #deedff; }
.action-btn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid #cfe0f1; background: #f4f9ff; color: #1e5788; font-weight: 900; cursor: pointer; margin-right: 4px; }
.action-btn.view { color: #225a86; }
.action-btn.edit { color: #1e5788; }
.action-btn.delete { color: #9a1f34; border-color: #efc8cf; background: #fff3f5; }
.action-btn:hover { filter: brightness(0.96); }
.resident-modal-overlay { position: fixed; inset: 0; background: rgba(12, 25, 42, 0.55); z-index: 240; display: none; align-items: center; justify-content: center; padding: 16px; }
.resident-modal-overlay.visible { display: flex; }
.resident-modal { width: min(760px, 100%); max-height: 92vh; overflow: hidden; border-radius: 18px; border: 1px solid #d6e4f2; background: #fff; box-shadow: 0 30px 70px rgba(12, 25, 42, 0.28); display: flex; flex-direction: column; }
.resident-modal-header { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: linear-gradient(125deg, #163a64, #1f5ea8 55%, #2a7562); }
.resident-modal-title-wrap { display: grid; gap: 3px; }
.resident-modal-title { color: #fff; font-weight: 800; font-size: 1.06rem; }
.resident-modal-subtitle { color: rgba(255,255,255,0.9); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
.resident-modal-close { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.08); color: #fff; font-size: 1.1rem; cursor: pointer; }
.resident-form { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.resident-form-scroll { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; padding: 14px 18px 10px; }
.resident-form-fields { display: contents; }
.resident-field { display: grid; gap: 5px; }
.resident-field.full { grid-column: 1 / -1; }
.resident-field label { color: #2b4f73; font-size: 0.74rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
.resident-field input { min-height: 42px; width: 100%; border: 2px solid #d2e0ed; border-radius: 11px; padding: 0 11px; font-size: 0.92rem; }
.resident-field select { min-height: 44px; width: 100%; border: 2px solid #cbdced; border-radius: 12px; padding: 0 11px; font-size: 0.92rem; background: #fff; color: #1f314a; font-weight: 700; }
.resident-field select:focus { border-color: #1f5ea8; box-shadow: 0 0 0 3px rgba(31, 94, 168, 0.1); outline: none; }
.resident-field select[multiple] { min-height: 112px; padding: 7px 8px; }
.resident-field select[multiple] option { border-radius: 8px; padding: 6px 8px; margin: 2px 0; }
.resident-field select[multiple] option:checked { background: linear-gradient(120deg, #e9f3ff, #e8f8f2); color: #1b4c7b; }
.resident-month-dropdown { position: relative; }
.resident-month-trigger { width: 100%; min-height: 44px; border: 2px solid #cbdced; border-radius: 12px; background: #fff; color: #1f314a; padding: 9px 38px 9px 11px; text-align: left; font-size: 0.92rem; font-weight: 700; cursor: pointer; position: relative; }
.resident-month-trigger::after { content: ""; position: absolute; right: 14px; top: 50%; width: 9px; height: 9px; border-right: 2px solid #536170; border-bottom: 2px solid #536170; transform: translateY(-65%) rotate(45deg); }
.resident-month-dropdown.open .resident-month-trigger { border-color: #2f8d55; box-shadow: 0 0 0 3px rgba(47, 141, 85, 0.1); }
.resident-month-options { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 260; display: none; max-height: 246px; overflow: auto; padding: 6px; border: 1px solid #d6e0ec; border-radius: 12px; background: #fff; box-shadow: 0 18px 38px rgba(27, 37, 54, 0.14); }
.resident-month-dropdown.open .resident-month-options { display: block; }
.resident-month-option { min-height: 36px; border-radius: 8px; background: #fff; color: #1f314a; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 10px 0 12px; font-size: 0.88rem; font-weight: 750; cursor: pointer; }
.resident-month-option input { position: absolute; opacity: 0; pointer-events: none; }
.resident-month-option:hover { background: #f3f7fb; }
.resident-month-option:has(input:checked) { background: #eaf7ef; color: #246c41; }
.resident-month-option::after { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #c8d8ea; flex: 0 0 auto; }
.resident-month-option:has(input:checked)::after { content: "✓"; display: inline-flex; align-items: center; justify-content: center; border-color: #2f8d55; background: #2f8d55; color: #fff; font-size: 0.75rem; font-weight: 900; line-height: 1; }
.resident-field input[readonly] { background: #f3f7fb; color: #4f6176; }
.resident-message { grid-column: 1 / -1; min-height: 18px; color: #b00020; font-weight: 700; font-size: 0.85rem; }
.resident-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid #e6edf5; background: #fff; }
.resident-save-btn, .resident-cancel-btn { min-height: 42px; border-radius: 11px; padding: 0 16px; font-weight: 800; cursor: pointer; }
.resident-save-btn { border: none; background: #2f8d55; color: #fff; box-shadow: 0 10px 24px rgba(47, 141, 85, 0.18); }
.resident-save-btn:disabled { opacity: 0.65; cursor: wait; }
.resident-cancel-btn { border: 1px solid #c8d8ea; background: #fff; color: #17314f; }
.view-modal-overlay { position: fixed; inset: 0; background: rgba(12, 25, 42, 0.55); z-index: 230; display: none; align-items: center; justify-content: center; padding: 16px; }
.view-modal-overlay.visible { display: flex; }
.view-modal { width: min(760px, 100%); max-height: 92vh; overflow: auto; border-radius: 16px; background: #fff; border: 1px solid #d6e4f2; box-shadow: 0 24px 60px rgba(12, 25, 42, 0.26); }
.view-modal-header { padding: 12px 14px; display:flex; justify-content:space-between; align-items:center; background: #f5f9ff; border-bottom:1px solid #dbe7f3; }
.view-modal-close { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #c7d8ea; background: #fff; color: #1e4f7b; font-size: 1.1rem; cursor: pointer; }
.view-grid { padding: 12px 14px 14px; display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.view-item { border: 1px solid #e0ebf6; border-radius: 10px; padding: 9px 10px; background: #fbfdff; }
.view-key { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: #5d7591; font-weight: 800; }
.view-value { margin-top: 5px; color: #17314f; font-weight: 700; overflow-wrap: anywhere; }
.table-wrap { background: #fff; border-radius: 12px; overflow-x: hidden; overflow-y: auto; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); max-height: 75vh; border: 1px solid #dde6f2; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th, td { border-bottom: 1px solid #edf1f7; padding: 5px 5px; text-align: left; white-space: normal; font-size: 0.72rem; line-height: 1.18; overflow-wrap: anywhere; word-break: break-word; }
th { position: sticky; top: 0; background: #1f2a3b; color: #fff; z-index: 5; text-transform: uppercase; }
tr:nth-child(even) { background: #f8fbff; }
tr:hover { background: #eaf3ff; }
.dashboard-metrics { display: grid; grid-template-columns: repeat(4, minmax(170px, 1fr)); gap: 12px; margin: 0 0 14px; }
.metric-card { background: #fff; border: 1px solid #d8e4ef; border-radius: 14px; padding: 14px 16px; box-shadow: 0 10px 24px rgba(16, 42, 72, 0.08); }
.metric-label { font-size: 0.74rem; color: #486481; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 800; }
.metric-value { margin-top: 6px; font-size: 1.3rem; font-weight: 800; color: #16324f; }
.metric-sub { margin-top: 3px; color: #6a7d91; font-size: 0.82rem; font-weight: 600; }
.resident-chip { display: inline-flex; align-items: center; justify-content: center; min-height: 26px; padding: 0 10px; border-radius: 999px; font-size: 0.76rem; font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; border: 1px solid transparent; }
.resident-chip.owner { background: var(--chip-owner-bg); color: var(--chip-owner-text); border-color: var(--chip-owner-border); }
.resident-chip.tenant { background: var(--chip-tenant-bg); color: var(--chip-tenant-text); border-color: var(--chip-tenant-border); }
.resident-chip.pending { background: var(--chip-pending-bg); color: var(--chip-pending-text); border-color: var(--chip-pending-border); }
.menu-badge { margin-left: 8px; min-width: 22px; height: 22px; border-radius: 999px; padding: 0 7px; font-size: 0.75rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent-text); }
.main-menu a.active .menu-badge { background: rgba(255,255,255,0.24); color: #fff; }
@media (max-width: 768px) {
  body { padding: 0; background: #f5f6f8; }
  .container { padding: 0; }
  .app-header { display: none; }
  .header-title { text-align: left; align-items: flex-start; }
  .nav-shell {
    position: relative;
    position: sticky;
    top: 0;
    z-index: 40;

  }
  .mobile-brand-row {

  }
  .mobile-menu-mark {

    height: 28px;
    flex: 0 0 auto;
    flex-direction: column;
    justify-content: space-between;
  }
  .mobile-menu-mark span {
    display: block;
    height: 5px;
    border-radius: 999px;
    background: rgba(255,255,255,0.9);
  }
  .mobile-menu-mark span:nth-child(1) { width: 34px; }
  .mobile-menu-mark span:nth-child(2) { width: 28px; }
  .mobile-menu-mark span:nth-child(3) { width: 24px; }
  .mobile-brand-title {
    color: #fff;
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 0.01em;
  }
  .profile-menu {
    position: absolute;
    top: 15px;
    right: 34px;
    z-index: 25;
  }
  .profile-button {
    width: 48px;
    height: 48px;
    border: 2px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.12);

    box-shadow: none;
    font-size: 1.05rem;
  }
  .profile-dropdown { top: calc(100% + 8px); }
  .main-menu {
    width: 100%;

    gap: 0;

  }
  .main-menu a {

    background: transparent;
    color: rgba(255,255,255,0.78);

  }

    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 5px;
    background: #fff;
  }
  #logoutBtn { width: 100%; }
  .controls { grid-template-columns: 1fr; gap: 12px; margin: 0 18px 18px; padding: 0; background: transparent; border-radius: 0; box-shadow: none; }
  .dashboard-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0 18px 14px; }
  .metric-card { padding: 12px 13px; border-radius: 12px; }
  .metric-value { font-size: 1.15rem; }
  .search-bar { display: block; }
  .search-bar input, .controls select {
    width: 100%;
    max-width: none;
    min-height: 52px;
    border: 2px solid #d6e0ec;
    border-radius: 14px;
    background: #fff;
    color: #1f314a;
    box-shadow: none;
    font-size: 0.98rem;

    box-shadow: 0 0 0 3px rgba(31, 94, 168, 0.1);
    outline: none;
  }
  select, input { width: 100%; }
  .table-wrap { display: none; }
  .card-list { display: block; padding: 0 18px 18px; margin-top: 0; }
  .mobile-card { padding: 16px; border-radius: 20px; margin-bottom: 12px; border: 1px solid #dbe6f2; box-shadow: 0 10px 22px rgba(22, 49, 79, 0.09); background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%); }
  .mobile-card-header { min-height: 56px; }

  .card-people { gap: 6px; margin-top: 8px; }

  .card-details { margin-top: 14px; }
  .detail-row { grid-template-columns: 1fr; gap: 6px; padding: 11px 12px; border-radius: 13px; margin-bottom: 8px; border-color: #dce8f3; background: #f7fbff; }
  .detail-key { font-size: 0.72rem; color: #587496; letter-spacing: 0.08em; }
  .detail-value { text-align: left; font-size: 0.94rem; color: #132f4d; font-weight: 700; }
  .call-link { justify-content: flex-start; background: #e7f6ed; border: 1px solid #bde0cc; color: #205f3e; border-radius: 999px; padding: 4px 9px; width: fit-content; }
  .call-icon { width: 22px; height: 22px; font-size: 0.72rem; background: #3cae64; }
  .toggle-icon { width: 36px; height: 36px; background: #e9f3ff; border-color: #c3d9ee; }
  .edit-resident-btn { min-height: 34px; }
  .resident-modal-overlay { align-items: flex-end; padding: 0; }
  .resident-modal { width: 100%; max-height: 94vh; border-radius: 20px 20px 0 0; }
  .resident-form-scroll { grid-template-columns: 1fr; padding: 16px 16px 10px; }

<script>

const DIRECTORY_SHEET_ID = "15iii2nw4THbf-t-TdYNfj5WW2Aw4selhvfwu64YzisE";
const DIRECTORY_TAB_NAME = "Sheet1";
const RESIDENT_WRITE_URL = "https://script.google.com/macros/s/AKfycbw2kvmc_dYgsicE00YDMPOx8icRxE8eIRbjJ1k9pRszPRwml-t6oU1C2W7gkmuq2Qqe/exec";
const RESIDENT_WRITE_SECRET = "MigSocietyPaymentWrite_2026_9xK4pL72Qz";
let headers = [], rows = [], filteredRows = [];
const searchIndexes = { name: [], mobile: [], vehicle: [] };
let activeResidentContext = null;
const RESIDENT_OCCUPIED_OPTIONS = ["UNOCCUPIED", "TENANT", "OWNER", "PHQ"];
const VEHICLE_TYPE_OPTIONS = ["BIKE", "SCOOTY", "CAR"];
function parseCSV(line) { return line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g)?.map(s => s.replace(/(^"|"$)/g, "")) || []; }
function normalize(value) { return String(value || "").trim().toLowerCase(); }

function normalizePhone(value) { return String(value || "").replace(/[^\d+]/g, ""); }
function escapeHtml(value) {
  return String(value || "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
}

}
function findHeaderIndex(patterns) {
  const normalizedHeaders = headers.map(h => normalize(h));
  return patterns.reduce((found, pattern) => found >= 0 ? found : normalizedHeaders.findIndex(h => h.includes(pattern)), -1);
}
function findPersonHeaderIndex(primaryPatterns, fallbackPatterns = []) {
  const excludedPatterns = ["vehicle", "car", "bike", "scooter", "number plate", "registration", "veh", "type", "parking"];
  const normalizedHeaders = headers.map(h => normalize(h));
  const matchPattern = (pattern) => normalizedHeaders.findIndex(header => header.includes(pattern) && !excludedPatterns.some(excluded => header.includes(excluded)));
  for (const pattern of primaryPatterns) {
    const index = matchPattern(pattern);
    if (index >= 0) return index;
  }
  for (const pattern of fallbackPatterns) {
    const index = matchPattern(pattern);
    if (index >= 0) return index;
  }
  return -1;
}
function isPhoneHeader(header) {
  const h = normalize(header);
  return ["mobile", "phone", "contact", "whatsapp"].some(pattern => h.includes(pattern));
}
function collectIndexes() {
  const namePatterns = ["name", "owner", "tenant", "resident"], mobilePatterns = ["mobile", "phone", "contact", "whatsapp"], vehiclePatterns = ["vehicle", "car", "bike", "number plate", "registration", "veh no", "vehicle no"];
  headers.forEach((header, index) => { const h = normalize(header); if (namePatterns.some(p => h.includes(p))) searchIndexes.name.push(index); if (mobilePatterns.some(p => h.includes(p))) searchIndexes.mobile.push(index); if (vehiclePatterns.some(p => h.includes(p))) searchIndexes.vehicle.push(index); });
}
function sanitizeResidentColumns(rawHeaders, rawRows) {
  const keepIndexes = [];
  rawHeaders.forEach((header, index) => {
    if (String(header || "").trim()) keepIndexes.push(index);
  });
  const cleanedHeaders = keepIndexes.map(index => String(rawHeaders[index] || "").trim());
  const cleanedRows = rawRows.map(row => keepIndexes.map(index => row[index] || ""));
  return { cleanedHeaders, cleanedRows };
}
function findColumnIndexByTokens(tokens) {
  const normalized = headers.map(h => normalize(h));
  return normalized.findIndex(h => tokens.some(token => h.includes(token)));
}
function displayColumnIndices() {
  return [
    findColumnIndexByTokens(["block"]),
    findColumnIndexByTokens(["flat", "house", "apartment"]),
    findColumnIndexByTokens(["owner name", "owner"]),
    findColumnIndexByTokens(["owner contact", "owner mobile", "owner phone", "owner whatsapp"]),
    findColumnIndexByTokens(["tenant name", "tenant"]),
    findColumnIndexByTokens(["tenant contact", "tenant mobile", "tenant phone", "tenant whatsapp"]),
  ].filter(i => i >= 0);
}
function occupiedByColumnIndex() {
  return findColumnIndexByTokens(["occupied by", "occupiedby", "occupancy"]);
}
function vehicleTypeColumnIndex() {
  return findColumnIndexByTokens(["vehicle type", "veh type", "vehicle"]);
}
function tenantNameColumnIndex() {
  return findColumnIndexByTokens(["tenant name", "tenant"]);
}
function tenantContactColumnIndex() {
  return findColumnIndexByTokens(["tenant contact", "tenant mobile", "tenant phone", "tenant whatsapp"]);
}
function selectedResidentVehicleTypes() {
  return Array.from(document.querySelectorAll('#residentFormFields .resident-month-options input[type="checkbox"]:checked')).map(input => input.value);
}
function updateResidentVehicleSummary() {

  const trigger = document.getElementById("residentVehicleTrigger");
  if (!trigger) return;
  trigger.textContent = selected.length ? selected.join(", ") : "Select vehicle type";
}
function setResidentVehicleDropdownOpen(open) {

}
function validateResidentPayload(payload) {
  const rowValues = payload.rowValues || [];
  const occIndex = occupiedByColumnIndex();
  const vehIndex = vehicleTypeColumnIndex();
  if (occIndex >= 0) {
    const value = String(rowValues[occIndex] || "").trim().toUpperCase();
    if (!RESIDENT_OCCUPIED_OPTIONS.includes(value)) return "Occupied By must be UNOCCUPIED, TENANT, OWNER or PHQ.";
  }
  if (vehIndex >= 0) {
    const raw = String(rowValues[vehIndex] || "").trim();
    if (raw) {
      const values = raw.split(/[,;|/]+/).map(v => String(v || "").trim().toUpperCase()).filter(Boolean);
      const invalid = values.find(v => !VEHICLE_TYPE_OPTIONS.includes(v));
      if (invalid) return "Vehicle Type must use BIKE, SCOOTY or CAR values only.";
    }
  }
  for (let i = 0; i < headers.length; i++) {
    const label = normalize(headers[i]);
    const value = String(rowValues[i] || "").trim();
    if (label.includes("contact") || label.includes("mobile") || label.includes("phone") || label.includes("whatsapp")) {
      if (value && !/^[0-9+\-\s()]{7,20}$/.test(value)) return `Invalid contact number for ${headers[i]}.`;
    }
  }
  return "";
}
function updateBlockFilterOptions() {
  const blockFilter = document.getElementById("blockFilter");
  const blockIndex = findHeaderIndex(["block"]);
  const selected = blockFilter.value;
  const blocks = Array.from(new Set(rows.map(row => normalizeBlockDisplay(row[blockIndex] || "")).filter(Boolean))).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  blockFilter.innerHTML = `<option value="">All Blocks</option>` + blocks.map(block => `<option value="${block}">${block}</option>`).join("");
  if (selected && blocks.includes(selected)) blockFilter.value = selected;
}
function renderTable(data) {
  const thead = document.getElementById("tableHead"), tbody = document.getElementById("tableBody"), cardList = document.getElementById("cardList");
  const blockIndex = findHeaderIndex(["block"]);
  const flatIndex = findHeaderIndex(["flat", "house", "apartment"]);
  const ownerIndex = findPersonHeaderIndex(["owner"], ["resident name", "name"]);
  const tenantIndex = findPersonHeaderIndex(["tenant"], ["occupant"]);
  const statusColumnName = "Occupancy Status";
  const shownCols = displayColumnIndices();
  thead.innerHTML = `<tr>${shownCols.map(i => `<th>${headers[i]}</th>`).join("")}<th>${statusColumnName}</th><th>Action</th></tr>`;
  tbody.innerHTML = data.map(row => {
    const ownerValue = ownerIndex >= 0 ? String(row[ownerIndex] || "").trim() : "";
    const tenantValue = tenantIndex >= 0 ? String(row[tenantIndex] || "").trim() : "";
    const status = tenantValue ? { label: "Tenant Occupied", cls: "tenant" } : ownerValue ? { label: "Owner Occupied", cls: "owner" } : { label: "Needs Update", cls: "pending" };
    const blockValue = normalizeBlockDisplay(row[blockIndex] || "");
    const flatValue = row[flatIndex] || "";
    return `<tr>${shownCols.map(i => `<td>${i === blockIndex ? normalizeBlockDisplay(row[i] || "") : (row[i] || "")}</td>`).join("")}<td><span class="resident-chip ${status.cls}">${status.label}</span></td><td><div class="action-group"><button class="action-btn view" type="button" title="View" data-action="view-resident" data-block="${escapeHtml(blockValue)}" data-flat="${escapeHtml(flatValue)}">👁</button><button class="action-btn edit" type="button" title="Edit" data-action="edit-resident" data-block="${escapeHtml(blockValue)}" data-flat="${escapeHtml(flatValue)}">✎</button><button class="action-btn delete" type="button" title="Delete details" data-action="delete-resident-fields" data-block="${escapeHtml(blockValue)}" data-flat="${escapeHtml(flatValue)}">🗑</button></div></td></tr>`;
  }).join("");
  cardList.innerHTML = data.map(row => {
    const blockValue = normalizeBlockDisplay(row[blockIndex] || "");
    const flatValue = row[flatIndex] || "";
    const ownerValue = ownerIndex >= 0 ? row[ownerIndex] || "" : "";
    const tenantValue = tenantIndex >= 0 ? row[tenantIndex] || "" : "";
    const cardTitle = `${blockValue} / Flat ${flatValue}`;
    const ownerLine = ownerValue ? `<div>Owner: ${ownerValue}</div>` : "";
    const tenantLine = tenantValue ? `<div>Tenant: ${tenantValue}</div>` : "";
    const status = tenantValue ? { label: "Tenant Occupied", cls: "tenant" } : ownerValue ? { label: "Owner Occupied", cls: "owner" } : { label: "Needs Update", cls: "pending" };
    const cardPeople = ownerLine || tenantLine ? `${ownerLine}${tenantLine}` : `<div>Resident details</div>`;
    const detailsHtml = headers.map((header, index) => `<div class="detail-row"><span class="detail-key">${header}</span><span class="detail-value">${isPhoneHeader(header) ? renderPhoneLink(row[index]) : (row[index] || "")}</span></div>`).join("");
    return `<div class="mobile-card" data-block="${blockValue}" data-flat="${flatValue}"><div class="mobile-card-header"><div class="mobile-card-copy"><div class="title">${cardTitle}</div><div class="card-people">${cardPeople}<div><span class="resident-chip ${status.cls}">${status.label}</span></div></div></div><div style="display:flex;align-items:center;gap:6px;"><button class="action-btn edit" type="button" title="Edit" data-action="edit-resident" data-block="${escapeHtml(blockValue)}" data-flat="${escapeHtml(flatValue)}">✎</button><button class="action-btn delete" type="button" title="Delete details" data-action="delete-resident-fields" data-block="${escapeHtml(blockValue)}" data-flat="${escapeHtml(flatValue)}">🗑</button><span class="toggle-icon">+</span></div></div><div class="card-details">${detailsHtml}</div></div>`;

function updateMetrics() {
  const badge = document.getElementById("residentNavBadge");
  if (badge) badge.textContent = rows.length.toLocaleString("en-IN");
}
function matchesByType(row, query, type) {
  if (!query) return true;
  if (type === "all") return row.some(cell => normalize(cell).includes(query));
  const indexes = searchIndexes[type] || [];
  if (!indexes.length) return row.some(cell => normalize(cell).includes(query));
  return indexes.some(i => normalize(row[i]).includes(query));
}
function applySearch() {
  const query = normalize(document.getElementById("searchInput").value), type = document.getElementById("searchType").value, selectedBlock = document.getElementById("blockFilter").value;
  const blockIndex = findHeaderIndex(["block"]);
  filteredRows = rows.filter(row => {
    const rowBlock = normalizeBlockDisplay(row[blockIndex] || "");
    return (!selectedBlock || rowBlock === selectedBlock) && matchesByType(row, query, type);
  });
  renderTable(filteredRows);
}
function findResidentRowByBlockFlat(block, flat) {
  const targetBlock = normalizeBlockDisplay(block);
  const targetFlat = String(flat || "").trim();
  const blockIndex = findHeaderIndex(["block"]);
  const flatIndex = findHeaderIndex(["flat", "house", "apartment"]);

}
function setResidentMessage(message, isSuccess = false) {

  if (document.body.classList.contains("modal-open")) return;

function openResidentModal(block, flat) {

  const flatIndex = findHeaderIndex(["flat", "house", "apartment"]);

      return `<div class="resident-field"><label>${escapeHtml(header)}</label><select data-col-index="${i}" ${isReadonly ? "disabled" : ""}>${options}</select></div>`;
    }

      const options = VEHICLE_TYPE_OPTIONS.map(option => `<label class="resident-month-option"><input type="checkbox" value="${option}" ${selected.has(option) ? "checked" : ""} ${isReadonly ? "disabled" : ""} /><span>${option}</span></label>`).join("");
      return `<div class="resident-field"><label>${escapeHtml(header)}</label><div class="resident-month-dropdown" id="residentVehicleDropdown"><button class="resident-month-trigger" id="residentVehicleTrigger" type="button" aria-expanded="false">Select vehicle type</button><div class="resident-month-options" data-col-index="${i}">${options}</div></div></div>`;

    }
    if (field.tagName === "SELECT" && field.multiple) {
      return Array.from(field.selectedOptions).map(option => option.value).filter(Boolean).join(", ");
    }
    return String(field.value || "").trim();
  });
  return {
    action: "saveResident",
    secret: RESIDENT_WRITE_SECRET,
    headers: headers.slice(),
    rowValues
  };
}
function submitResidentPayloadViaJsonp(payload) {
  return new Promise((resolve, reject) => {
    const callbackName = `residentWriteCallback_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
    let script;
    let timeoutId;
    const cleanup = () => {
      if (window[callbackName]) delete window[callbackName];
      if (script && script.parentNode) script.parentNode.removeChild(script);
      if (timeoutId) clearTimeout(timeoutId);
    };
    window[callbackName] = (result) => {
      cleanup();
      resolve(result || { ok: false, error: "Empty response from resident service." });
    };
    const query = new URLSearchParams({
      action: "saveResident",
      callback: callbackName,
      payload: JSON.stringify(payload),
      _: String(Date.now()),
    });
    script = document.createElement("script");
    script.src = `${RESIDENT_WRITE_URL}?${query.toString()}`;
    script.async = true;
    script.onerror = () => {
      cleanup();
      reject(new Error("Unable to reach resident update service."));
    };
    timeoutId = setTimeout(() => {
      cleanup();
      reject(new Error("Resident update service timed out."));
    }, 15000);
    document.body.appendChild(script);
  });
}
async function saveResident(event) {
  event.preventDefault();
  const payload = buildResidentPayload();
  if (!payload) return;
  const validationError = validateResidentPayload(payload);
  if (validationError) {
    setResidentMessage(validationError);
    return;
  }
  const saveBtn = document.getElementById("saveResidentBtn");
  saveBtn.disabled = true;
  setResidentMessage("Saving resident details...");
  try {
    const result = await submitResidentPayloadViaJsonp(payload);
    if (!result.ok) throw new Error(result.error || "Unable to save resident details.");
    setResidentMessage("Resident details saved successfully.", true);
    await loadDirectoryData();
    setTimeout(closeResidentModal, 400);
  } catch (error) {
    setResidentMessage(error.message || "Unable to save resident details.");
  } finally {
    saveBtn.disabled = false;
  }
}
function openViewModal(block, flat) {
  const row = findResidentRowByBlockFlat(block, flat);
  if (!row) return;
  document.getElementById("viewModalTitle").textContent = `${block} / Flat ${flat}`;
  document.getElementById("viewModalGrid").innerHTML = headers.map((header, i) => `<div class="view-item"><div class="view-key">${escapeHtml(header)}</div><div class="view-value">${escapeHtml(row[i] || "-")}</div></div>`).join("");
  const overlay = document.getElementById("viewModalOverlay");
  overlay.classList.add("visible");
  overlay.setAttribute("aria-hidden", "false");
  lockBodyScroll();
}
function closeViewModal() {
  const overlay = document.getElementById("viewModalOverlay");
  overlay.classList.remove("visible");
  overlay.setAttribute("aria-hidden", "true");
  if (!document.getElementById("residentModalOverlay").classList.contains("visible")) unlockBodyScroll();
}
async function deleteResidentFields(block, flat) {
  const payload = {
    action: "deleteResidentFields",
    secret: RESIDENT_WRITE_SECRET,
    block,
    flat,
    headers: headers.slice()
  };
  setResidentMessage("");
  const result = await submitResidentPayloadViaJsonp(payload);
  if (!result.ok) throw new Error(result.error || "Unable to delete resident details.");
}
async function loadDirectoryData() {
  const errorText = document.getElementById("errorText"); errorText.textContent = "";
  try {
    const url = `https://docs.google.com/spreadsheets/d/${DIRECTORY_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(DIRECTORY_TAB_NAME)}`;
    const res = await fetch(url); const csv = await res.text();
    if (!csv.trim() || csv.trim().toLowerCase().startsWith("<!doctype html")) throw new Error("Invalid sheet response. Check sheet ID/tab name and sharing permissions.");
    const lines = csv.split("\n").filter(Boolean);
    const parsedHeaders = parseCSV(lines[0]);
    const parsedRows = lines.slice(1).map(parseCSV).filter(r => r.length > 0);
    const { cleanedHeaders, cleanedRows } = sanitizeResidentColumns(parsedHeaders, parsedRows);
    headers = cleanedHeaders;
    rows = cleanedRows;
    searchIndexes.name = []; searchIndexes.mobile = []; searchIndexes.vehicle = []; collectIndexes();
    updateBlockFilterOptions();
    updateMetrics();
    filteredRows = rows; renderTable(filteredRows);
  } catch (error) { errorText.textContent = error.message; document.getElementById("metaInfo").textContent = "Failed to load data"; }
}
document.getElementById("searchInput").addEventListener("input", applySearch);
document.getElementById("searchType").addEventListener("change", applySearch);
document.getElementById("blockFilter").addEventListener("change", applySearch);
const profileToggle = document.getElementById("profileToggle");
const profileDropdown = document.getElementById("profileDropdown");
if (profileToggle && profileDropdown) {
  profileToggle.addEventListener("click", (event) => {
    event.stopPropagation();
    const visible = profileDropdown.classList.toggle("visible");
    profileToggle.setAttribute("aria-expanded", visible);
  });
  document.addEventListener("click", (event) => {
    if (!event.target.closest(".profile-menu")) {
      profileDropdown.classList.remove("visible");
      profileToggle?.setAttribute("aria-expanded", "false");
    }
  });
}
document.getElementById("cardList").addEventListener("click", (event) => {
  if (event.target.closest(".call-link")) return;
  const viewBtn = event.target.closest('[data-action="view-resident"]');
  if (viewBtn) {
    event.stopPropagation();
    openViewModal(viewBtn.dataset.block || "", viewBtn.dataset.flat || "");
    return;
  }
  const editBtn = event.target.closest('[data-action="edit-resident"]');
  if (editBtn) {
    event.stopPropagation();
    openResidentModal(editBtn.dataset.block || "", editBtn.dataset.flat || "");
    return;
  }
  const deleteBtn = event.target.closest('[data-action="delete-resident-fields"]');
  if (deleteBtn) {
    event.stopPropagation();
    if (!confirm(`Delete all resident details except Block/Flat for ${deleteBtn.dataset.block} / ${deleteBtn.dataset.flat}?`)) return;
    deleteResidentFields(deleteBtn.dataset.block || "", deleteBtn.dataset.flat || "").then(loadDirectoryData).catch(error => {
      document.getElementById("errorText").textContent = error.message || "Unable to delete resident details.";
    });
    return;
  }
  const header = event.target.closest(".mobile-card-header");
  if (!header) return;
  const card = header.closest(".mobile-card");
  if (!card) return;
  card.classList.toggle("expanded");
  const icon = card.querySelector(".toggle-icon");
  if (icon) icon.textContent = card.classList.contains("expanded") ? "−" : "+";
});
document.getElementById("tableBody").addEventListener("click", (event) => {
  const viewBtn = event.target.closest('[data-action="view-resident"]');
  if (viewBtn) {
    openViewModal(viewBtn.dataset.block || "", viewBtn.dataset.flat || "");
    return;
  }
  const editBtn = event.target.closest('[data-action="edit-resident"]');
  if (editBtn) {
    openResidentModal(editBtn.dataset.block || "", editBtn.dataset.flat || "");
    return;
  }
  const deleteBtn = event.target.closest('[data-action="delete-resident-fields"]');
  if (!deleteBtn) return;
  if (!confirm(`Delete all resident details except Block/Flat for ${deleteBtn.dataset.block} / ${deleteBtn.dataset.flat}?`)) return;
  deleteResidentFields(deleteBtn.dataset.block || "", deleteBtn.dataset.flat || "").then(loadDirectoryData).catch(error => {
    document.getElementById("errorText").textContent = error.message || "Unable to delete resident details.";
  });
});
document.getElementById("residentForm").addEventListener("submit", saveResident);
document.getElementById("cancelResidentBtn").addEventListener("click", closeResidentModal);
document.getElementById("closeResidentModalBtn").addEventListener("click", closeResidentModal);
document.getElementById("residentModalOverlay").addEventListener("click", (event) => {
  if (event.target.id === "residentModalOverlay") closeResidentModal();
});
document.addEventListener("click", (event) => {
  if (!event.target.closest("#residentVehicleDropdown")) setResidentVehicleDropdownOpen(false);
});
document.getElementById("closeViewModalBtn").addEventListener("click", closeViewModal);
document.getElementById("viewModalOverlay").addEventListener("click", (event) => {
  if (event.target.id === "viewModalOverlay") closeViewModal();
});
loadDirectoryData();
</script>
